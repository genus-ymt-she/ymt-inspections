name: YouTube probe
on:
  push:
    branches: [claude/github-app-upgrade-9zm1in]
    paths: [.github/workflows/yt-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for id in vtPk5IUbdH0 YtU_u0RyGZU rTapkyLg8-M f7-UXcRcxbw; do
            code=$(curl -s -m 15 -o o.json -w '%{http_code}' "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$id&format=json")
            echo "$id $code $(python3 -c "import json;d=json.load(open('o.json'));print(d.get('title'),'|',d.get('author_name'))" 2>/dev/null)"
          done
