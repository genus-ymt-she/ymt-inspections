name: FDR probe
on:
  push:
    branches: [claude/github-app-upgrade-9zm1in]
    paths: [.github/workflows/fdr-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: HTTP endpoints
        run: |
          for u in https://reg.bom.gov.au/fwo/IDW14199.xml http://www.bom.gov.au/fwo/IDW14199.xml https://www.bom.gov.au/fwo/IDW14199.xml https://www.bom.gov.au/wa/forecasts/fire-danger.shtml https://www.emergency.wa.gov.au/ ; do
            echo "== $u"; curl -s -m 20 -D - -o body.txt -A 'Mozilla/5.0 (compatible; Google-Apps-Script)' "$u" | head -5; head -c 300 body.txt; echo; done
      - name: FTP candidates
        run: |
          timeout 60 curl -s -m 50 --list-only ftp://ftp.bom.gov.au/anon/gen/fwo/ > list.txt || echo "list failed $?"
          wc -l list.txt; grep -cE '^IDW.*\.xml$' list.txt || true
          mkdir x
          (grep -E '^IDW.*\.xml$' list.txt; printf 'IDW14199.xml\nIDW12300.xml\nIDW14100.xml\nIDW12400.xml\n') | sort -u | head -300 > want.txt
          timeout 300 xargs -P 24 -I{} curl -s -m 20 -o x/{} ftp://ftp.bom.gov.au/anon/gen/fwo/{} < want.txt || true
          ls x | wc -l
          echo "== files containing fire_danger"; grep -l 'fire_danger' x/* || true
          for f in $(grep -l 'fire_danger' x/* ); do echo "##### $f"; grep -o '<product-type>[^<]*' $f | head -1; grep -o 'issue-time-local[^<]*' $f | head -1; grep -o '<area [^>]*>' $f | head -60; grep -o '<text type="fire_danger">[^<]*' $f | sort | uniq -c; done
          echo "== mentions Badgingarra/Dandaragan"; grep -il 'badgingarra\|dandaragan' x/* || true
