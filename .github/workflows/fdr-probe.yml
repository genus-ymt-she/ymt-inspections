name: FDR probe
on:
  push:
    branches: [claude/github-app-upgrade-9zm1in]
    paths: [.github/workflows/fdr-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -s -m 30 -o f.xml ftp://ftp.bom.gov.au/anon/gen/fwo/IDW15100.xml; wc -c f.xml
          echo "reg http: $(curl -s -m 20 -o /dev/null -w '%{http_code}' https://reg.bom.gov.au/fwo/IDW15100.xml)"
          head -c 1500 f.xml; echo; echo =====
          python3 - <<'PY'
          import re
          x=open('f.xml').read()
          for n in ('Watheroo','Lesueur'):
              m=re.search(r'<area [^>]*description="%s"[^>]*>.*?</area>'%n,x,re.S); print(m.group(0) if m else 'none'); print('-----')
          PY
