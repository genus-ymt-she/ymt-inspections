/* Direct send: the relay link lives in config.json in the GitHub repo, so it can be changed without rebuilding the app. */
let RELAY={url:"",key:""};
try{const c=JSON.parse(ls("relayCfg")||"null");if(c&&c.url)RELAY=c}catch(e){}
async function loadRelay(){try{const r=await fetch("config.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)return;const c=await r.json();
  if(c&&typeof c.relayUrl==="string"){RELAY={url:c.relayUrl.trim(),key:c.key||""};ls("relayCfg",JSON.stringify(RELAY))}}catch(e){}}
const directOn=()=>/^https:\/\/script\.google(usercontent)?\.com\//.test(RELAY.url)||/^https?:\/\/localhost/.test(RELAY.url);

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
const mem = {};
let idb = null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("ymt-inspections",2);
  r.onupgradeneeded=()=>{const d=r.result;["drafts","sent","outbox"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id"})})};
  r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>res();}catch(e){res()}})}
function tx(store,mode){return idb.transaction(store,mode).objectStore(store)}
function dbPut(store,obj){if(!idb){(mem[store]=mem[store]||{})[obj.id]=obj;return Promise.resolve()}
  return new Promise((res,rej)=>{const r=tx(store,"readwrite").put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function dbGet(store,id){if(!idb)return Promise.resolve((mem[store]||{})[id]);
  return new Promise(res=>{const r=tx(store,"readonly").get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})}
function dbAll(store){if(!idb)return Promise.resolve(Object.values(mem[store]||{}));
  return new Promise(res=>{const r=tx(store,"readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])})}
function dbDel(store,id){if(!idb){delete (mem[store]||{})[id];return Promise.resolve()}
  return new Promise(res=>{const r=tx(store,"readwrite").delete(id);r.onsuccess=()=>res();r.onerror=()=>res()})}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tabByNum = n=>TABS.find(t=>t.num===n);
const allQ = t=>t.sections.flatMap(s=>s.q);
function recipient(){return (ls("recipientOverride")||CONFIG.recipient||"").trim()}
function recipientOK(){const r=recipient();return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r)}
function toast(m,ms=2600){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),ms)}
function pad(n){return String(n).padStart(2,"0")}
function nowLocal(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmtDT(v){if(!v)return "";const d=new Date(v);if(isNaN(d))return v;return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmtD(v){if(!v)return "";const p=v.split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}
function initials(n){return (n||"").split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()).join("").slice(0,3)||"XX"}
const RLABEL={C:"C",UA:"UA",NI:"NI",NA:"N/A"};
const RSUB={C:"Compliant",UA:"Stop work",NI:"Improve",NA:"Not applicable"};
const RKEY=[["C","#2E7D32","Compliant","meets the requirement in the plan."],["UA","#C62828","Not compliant – UNACCEPTABLE","stop work, make safe and take immediate action. Notify the Supervisor and SHE Manager."],["NI","#E39A00","Not compliant – Needs improvement","safe to continue; corrective action required."],["NA","#7A8594","Not applicable","to this inspection / work front."]];
function keyHTML(){return `<div class="key"><div class="kt">Rating key</div><div class="kr">${RKEY.map(k=>`<div class="ki"><span class="kb" style="background:${k[1]}">${RLABEL[k[0]]}</span><span><b>${k[2]}</b> – ${k[3]}</span></div>`).join("")}</div>
  <div class="ks"><span class="snn"><img src="${SNN_ICONS.FND}" alt="">SNN</span> Orange tag with the Genus icon = item linked to a Safety Non-Negotiable. A UA or NI on these items is flagged in the report and email.</div></div>`}
function snnNames(codes){return (codes||[]).map(c=>SNN[c]).filter(Boolean)}

/* ---------- draft model ---------- */
function newDraft(num){const t=tabByNum(num);const id="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const extra={};(t.extra||[]).forEach(l=>extra[l]="");
  return {id,tab:num,created:Date.now(),updated:Date.now(),
    details:{location:t.lockLocation||"",datetime:nowLocal(),crew:"",inspector:ls("inspector")||"",supervisor:"",extra,
      checks:t.checks?{"0|1":ls("inspector")||""}:undefined},
    answers:{},others:[],signature:"",reportId:""};}
function stats(d){const t=tabByNum(d.tab);const qs=allQ(t);const c={C:0,UA:0,NI:0,NA:0};let rated=0;
  qs.forEach(q=>{const a=d.answers[q.id];if(a&&a.r){c[a.r]++;rated++}});
  d.others.forEach(o=>{if(o.r)c[o.r]++});
  const ncs=nonCompliances(d);const snnN=ncs.filter(n=>n.snn.length).length;
  const den=c.C+c.UA+c.NI;return {...c,rated,total:qs.length,pct:den?Math.round(c.C/den*100):null,ncs,snnN}}
function nonCompliances(d){const t=tabByNum(d.tab);const out=[];
  allQ(t).forEach(q=>{const a=d.answers[q.id];if(a&&(a.r==="UA"||a.r==="NI"))out.push({id:q.id,text:q.text,ref:q.ref,snn:q.snn||[],...a,photos:a.photos||[]})});
  d.others.forEach((o,i)=>{if(o.r==="UA"||o.r==="NI")out.push({id:`${t.num}.X${i+1}`,text:"Additional hazard: "+(o.title||""),ref:"",snn:o.snn||[],...o,photos:o.photos||[]})});
  const w=n=>(n.r==="UA"?0:2)+(n.snn.length?0:1);return out.map((n,i)=>[n,i]).sort((x,y)=>w(x[0])-w(y[0])||x[1]-y[1]).map(x=>x[0])}
function ncComplete(a){if(!a.finding||!a.finding.trim())return false;if(!a.action||!a.action.trim())return false;
  if(a.closed===true)return !!(a.taken&&a.taken.trim());return a.closed===false}
function problems(d){const p=[];const t=tabByNum(d.tab);
  if(!d.details.location.trim())p.push("Inspection location / work front");
  if(!d.details.inspector.trim())p.push("Inspector name");
  const un=allQ(t).filter(q=>!(d.answers[q.id]&&d.answers[q.id].r));if(un.length)p.push(`${un.length} item(s) not rated`);
  const inc=nonCompliances(d).filter(n=>!ncComplete(n));if(inc.length)p.push(`${inc.length} non-compliance(s) missing finding / corrective action / closed status`);
  d.others.forEach((o,i)=>{if(!o.r||!(o.title||"").trim())p.push(`Additional hazard ${i+1} needs a description and rating`)});
  if(t.checks){const C=t.checks;const done=checkDone(d);
    C.cols.forEach((col,c)=>{if(checkStarted(d,c)&&!done[c]){const miss=[];if(!chkVal(d,c,0))miss.push("time");if(!chkVal(d,c,1))miss.push("inspected by");
      (C.photos||[]).forEach((_,k)=>{if(!chkPhoto(d,c,k))miss.push(`photo – ${(C.photoShort||[])[k]||"photo "+(k+1)}`)});p.push(`${col} check missing: ${miss.join(", ")}`)}});
    if(!done.some(Boolean)&&!C.cols.some((_,c)=>checkStarted(d,c)))p.push(`Complete the ${C.cols[0]} or ${C.cols[1]} check – time, inspected by and ${(C.photos||[]).length} photos`)}
  return p}

/* Reads the camera's own capture time (EXIF DateTimeOriginal) so an old gallery photo cannot pass as a new one. */
async function exifDate(file){const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return null;let o=2;
  while(o<v.byteLength-10){const m=v.getUint16(o),len=v.getUint16(o+2);
    if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){const t=o+10,le=v.getUint16(t)===0x4949;const g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
      const ifd=off=>{const n=g16(t+off),e={};for(let i=0;i<n;i++){const q=t+off+2+i*12;e[g16(q)]={count:g32(q+4),val:q+8}}return e};
      const str=en=>{const off=en.count>4?t+g32(en.val):en.val;let s="";for(let i=0;i<en.count-1;i++)s+=String.fromCharCode(v.getUint8(off+i));return s};
      const i0=ifd(g32(t+4));let ds=null;if(i0[0x8769]){const ex=ifd(g32(i0[0x8769].val));if(ex[0x9003])ds=str(ex[0x9003])}if(!ds&&i0[0x0132])ds=str(i0[0x0132]);
      const mm=ds&&ds.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);return mm?new Date(+mm[1],mm[2]-1,+mm[3],+mm[4],+mm[5],+mm[6]).getTime():null}
    if((m&0xFF00)!==0xFF00)break;o+=2+len}return null}
function stampPhoto(file,lines){return new Promise(async(res,rej)=>{let ex=null;try{ex=await exifDate(file)}catch(e){}const added=Date.now();
  const old=!!(ex&&Math.abs(added-ex)>60*60*1000);const taken=ex||added;
  const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const m=1600;let{width:w,height:h}=img;const s=Math.min(1,m/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    const bh=Math.max(84,Math.round(Math.min(w,h)*0.17));g.fillStyle="rgba(17,43,78,.82)";g.fillRect(0,h-bh,w,bh);g.fillStyle="#EC7723";g.fillRect(0,h-bh,w,Math.max(3,bh*0.05));
    const f1=Math.round(bh*0.28),f2=Math.round(bh*0.155);g.textBaseline="alphabetic";
    const l1=old?`TAKEN ${fmtDT(taken)} · ADDED ${fmtDT(added)}`:fmtDT(taken);let fs=f1;g.font=`bold ${fs}px Arial, sans-serif`;
    while(g.measureText(l1).width>w-bh*0.44&&fs>10){fs--;g.font=`bold ${fs}px Arial, sans-serif`}
    g.fillStyle=old?"#FFB066":"#fff";g.fillText(l1,Math.round(bh*0.2),h-bh+Math.round(bh*0.38));
    g.font=`${f2}px Arial, sans-serif`;g.fillStyle="#fff";
    lines.forEach((ln,i)=>{let f=f2;g.font=`${f}px Arial, sans-serif`;while(g.measureText(ln).width>w-bh*0.4&&f>9){f--;g.font=`${f}px Arial, sans-serif`}
      g.fillText(ln,Math.round(bh*0.2),h-bh+Math.round(bh*(0.63+i*0.24)))});
    res({img:c.toDataURL("image/jpeg",0.76),taken,added,old,exif:!!ex})};img.onerror=e=>{URL.revokeObjectURL(url);rej(e)};img.src=url})}

function initSig(d){const c=$("#sig");const r=c.getBoundingClientRect();const k=window.devicePixelRatio||1;c.width=r.width*k;c.height=r.height*k;const g=c.getContext("2d");g.scale(k,k);g.lineWidth=2.2;g.lineCap="round";g.strokeStyle="#112B4E";

  sectionTitle(`NON-COMPLIANCES & CORRECTIVE ACTIONS (${s.ncs.length})`);
  const ICO=7.5,IG=1.2;
  if(s.ncs.length){doc.autoTable({startY:y,margin:{left:M,right:M,top:16,bottom:16},
     head:[["#","Rating","Item / finding","Proposed corrective action","Status","SNN"]],
     body:s.ncs.map(n=>[n.id,n.r,PDFSAFE(`${n.text}\n\nFinding: ${n.finding}`),PDFSAFE(n.action),PDFSAFE(n.closed?`CLOSED at time of inspection\nAction taken: ${n.taken}`:`OPEN${n.owner?`\nResponsible: ${n.owner}`:""}${n.due?`\nDue: ${fmtD(n.due)}`:""}`),PDFSAFE(snnNames(n.snn).join("\n")||"-")]),
     theme:"grid",styles:{font:"helvetica",fontSize:7.6,cellPadding:1.6,lineColor:[200,206,214],lineWidth:.2,textColor:20,valign:"top"},
     headStyles:{fillColor:NAVY,textColor:255,fontStyle:"bold"},
     columnStyles:{0:{cellWidth:11,fontStyle:"bold"},1:{cellWidth:12,halign:"center",fontStyle:"bold"},2:{cellWidth:62},3:{cellWidth:41},4:{cellWidth:32},5:{cellWidth:28,halign:"center"}},
     didDrawCell:c=>{if(c.section!=="body"||c.column.index!==5)return;const codes=(s.ncs[c.row.index]||{}).snn||[];if(!codes.length)return;
       const tot=codes.length*ICO+(codes.length-1)*IG;let x=c.cell.x+(c.cell.width-tot)/2;
       codes.forEach(k=>{if(SNN_ICONS[k]){doc.addImage(SNN_ICONS[k],"PNG",x,c.cell.y+1.6,ICO,ICO)}x+=ICO+IG})},
     didParseCell:c=>{if(c.section==="body"&&c.column.index===5&&((s.ncs[c.row.index]||{}).snn||[]).length){c.cell.styles.cellPadding={top:1.6+ICO+1.2,bottom:1.6,left:1,right:1};c.cell.styles.fontSize=6.8}
       if(c.section==="body"&&c.column.index===1){c.cell.styles.textColor=255;c.cell.styles.fillColor=c.cell.raw==="UA"?hex("#C62828"):hex("#E39A00")}
       if(c.section==="body"&&c.column.index===5&&c.cell.raw!=="-"){c.cell.styles.textColor=ORG;c.cell.styles.fontStyle="bold"}
       if(c.section==="body"&&c.column.index===4){c.cell.styles.textColor=String(c.cell.raw).startsWith("CLOSED")?hex("#2E7D32"):hex("#C62828");c.cell.styles.fontStyle="bold"}}});
    y=doc.lastAutoTable.finalY+4;
    // photos
    const ph=s.ncs.flatMap(n=>n.photos.map(p=>({p,id:n.id})));
    if(ph.length){if(y>230){doc.addPage();y=16}sectionTitle(`PHOTOS (${ph.length})`);const pw=(W-2*M-2*4)/3;
      for(let i=0;i<ph.length;i++){const ip=doc.getImageProperties(ph[i].p);const phh=Math.min(pw*ip.height/ip.width,70);const col=i%3;
        if(col===0&&i>0)y+=rowH+6;if(col===0){var rowH=0}
        if(y+phh>280){doc.addPage();y=16}
        const x=M+col*(pw+4);const iw=phh*ip.width/ip.height;doc.addImage(ph[i].p,"JPEG",x,y,Math.min(iw,pw),phh);doc.setFontSize(7);doc.setTextColor(80);doc.text(`Item ${ph[i].id}`,x,y+phh+3.5);rowH=Math.max(rowH,phh)}
      y+=rowH+8}
  }else{doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(60);doc.text("No non-compliances identified.",M,y+3);y+=8}
  if(t.checks&&(t.checks.photos||[]).length){const C=t.checks;const list=[];C.cols.forEach((col,c)=>C.photos.forEach((_,k)=>{const ph=chkPhoto(d,c,k);if(ph)list.push({ph,cap:`${col} – ${(C.photoShort||[])[k]||""}`})}));
    if(list.length){if(y>200){doc.addPage();y=16}sectionTitle(`TRAFFIC MANAGEMENT PHOTOS – TIMESTAMPED (${list.length})`);const pw=(W-2*M-6)/2;let rowH=0;
      list.forEach((it,i)=>{const ip=doc.getImageProperties(it.ph.img);const ph=Math.min(pw*ip.height/ip.width,95);const iw=ph*ip.width/ip.height;const col=i%2;
        if(col===0&&i>0){y+=rowH+8;rowH=0}if(col===0&&y+ph>280){doc.addPage();y=16}
        const x=M+col*(pw+6);doc.addImage(it.ph.img,"JPEG",x,y,iw,ph);doc.setFont("helvetica","bold");doc.setFontSize(7.2);doc.setTextColor(...NAVY);
        doc.text(PDFSAFE(it.cap+(it.ph.old?"  (photo not taken at time of check – see stamp)":"")),x,y+ph+3.6,{maxWidth:pw});rowH=Math.max(rowH,ph)});
      y+=rowH+9}}
  // full checklist
  if(y>240){doc.addPage();y=16}
  sectionTitle("FULL CHECKLIST");
  const body=[];t.sections.forEach(sec=>{body.push([{content:sec.name,colSpan:5,styles:{fillColor:hex("#FDECDE"),textColor:NAVY,fontStyle:"bold",fontSize:7.5}}]);
    sec.q.forEach(q=>{const a=d.answers[q.id]||{};let cm=a.comment||"";if(a.r==="UA"||a.r==="NI")cm=`Finding: ${a.finding||""}`+(a.closed?" (closed)":" (open)");
      body.push([q.id,PDFSAFE(q.text)+((q.snn||[]).length?`\n[SNN: ${snnNames(q.snn).join(" / ")}]`:""),PDFSAFE(q.ref),RLABEL[a.r]||"",PDFSAFE(cm)])})});
  d.others.forEach((o,i)=>{if(i===0)body.push([{content:"OTHER HAZARDS IDENTIFIED",colSpan:5,styles:{fillColor:hex("#FDECDE"),textColor:NAVY,fontStyle:"bold",fontSize:7.5}}]);
    body.push([`X${i+1}`,PDFSAFE(o.title)+((o.snn||[]).length?`\n[SNN: ${snnNames(o.snn).join(" / ")}]`:""),"",o.r,PDFSAFE(`Finding: ${o.finding||""}`+(o.closed?" (closed)":" (open)"))])});
  doc.autoTable({startY:y,margin:{left:M,right:M,top:16,bottom:16},head:[["#","Inspection item","Plan ref","Result","Comment"]],body,theme:"grid",
    styles:{font:"helvetica",fontSize:7.2,cellPadding:1.4,lineColor:[200,206,214],lineWidth:.2,textColor:20,valign:"top"},headStyles:{fillColor:NAVY,textColor:255},
    columnStyles:{0:{cellWidth:10,fontStyle:"bold"},1:{cellWidth:98},2:{cellWidth:22,fontSize:6.5,textColor:90},3:{cellWidth:12,halign:"center",fontStyle:"bold"},4:{cellWidth:44}},
    didParseCell:c=>{if(c.section==="body"&&c.column.index===3){const m={C:"#2E7D32",UA:"#C62828",NI:"#E39A00","N/A":"#7A8594"}[c.cell.raw];if(m){c.cell.styles.fillColor=hex(m);c.cell.styles.textColor=255}}}});
  y=doc.lastAutoTable.finalY+5;
  if(t.image){const ip=doc.getImageProperties(t.image);const iw=W-2*M,ih=iw*ip.height/ip.width;if(y+ih+10>282){doc.addPage();y=16}
    sectionTitle(PDFSAFE((t.imageTitle||"Reference").toUpperCase()));doc.addImage(t.image,"JPEG",M,y,iw,ih);doc.setDrawColor(200,206,214);doc.rect(M,y,iw,ih);y+=ih+6}
  // sign-off
  if(y>222){doc.addPage();y=16}
  sectionTitle("SIGN-OFF");
  doc.autoTable({startY:y,margin:{left:M,right:M},theme:"grid",styles:{font:"helvetica",fontSize:8,cellPadding:2,lineColor:[200,206,214],lineWidth:.2,minCellHeight:9},
    columnStyles:{0:{fontStyle:"bold",fillColor:GREY,textColor:NAVY,cellWidth:55}},
    body:[["Inspected by",PDFSAFE(D.inspector)],["Signature",""],["Date & time",fmtDT(D.datetime)],["Entered in MYOSH – inspection ref No",""],["Hazards added to Hazard Register (SHE Manager)",""]],
    didDrawCell:c=>{if(c.section==="body"&&c.row.index===1&&c.column.index===1&&d.signature){const h=Math.min(c.cell.height-2,14);try{doc.addImage(d.signature,"PNG",c.cell.x+2,c.cell.y+1,h*2.6,h)}catch(e){}}},
    didParseCell:c=>{if(c.section==="body"&&c.row.index===1)c.cell.styles.minCellHeight=16}});
  // footer
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(6.8);doc.setTextColor(110);
    doc.text(`${docId}  |  Rev ${CONFIG.rev}  |  ${reportId(d)}`,M,290);doc.text(`PARRON v${CONFIG.appVersion}  |  Uncontrolled when printed  |  Page ${i} of ${n}`,W-M,290,{align:"right"});
    if(i>1){doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(...NAVY);doc.text(PDFSAFE(`${t.title}  –  ${D.location}  –  ${fmtDT(D.datetime)}`),M,9)}}
  PDFBLOB=doc.output("blob");return PDFBLOB}

function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000)}
/* PDF is prepared as soon as the review screen opens, so the share call happens
   directly inside the tap (phones refuse to open the share menu after a delay). */
let PDFFILE=null,SHARE_TEXT=true;
function setShareState(ready){const b=$("#bShare");if(!b||b.dataset.blocked)return;b.disabled=!ready;b.textContent=ready?(directOn()?"Send report":"Share PDF via Outlook"):"Preparing report…"}
function prepPDF(d){PDFFILE=null;setShareState(false);clearTimeout(prepPDF._t);prepPDF._t=setTimeout(async()=>{try{PDFBLOB=null;const b=await buildPDF(d);
  PDFFILE=new File([b],fileName(d),{type:"application/pdf"});setShareState(true)}catch(e){console.error(e);toast("Could not create the PDF");setShareState(true)}},200)}
function isMobile(){return !!((navigator.userAgentData&&navigator.userAgentData.mobile)||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent)))}
function copyAddr(){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(recipient()).catch(()=>{})}catch(e){}}
function sendShare(){const d=CUR;if(!PDFFILE){toast("Report still being prepared – tap again in a moment");return}
  if(!(isMobile()&&navigator.canShare&&navigator.canShare({files:[PDFFILE]}))){sendOutlookLink();return}
  const data=SHARE_TEXT?{files:[PDFFILE],title:subject(d)}:{files:[PDFFILE]};
  let p;try{p=navigator.share(data)}catch(e){p=Promise.reject(e)}
  copyAddr();toast(`Tap Outlook, then paste ${recipient()} into To`,6000);
  p.then(()=>{d.shareUsed=true;save(d,true)}).catch(e=>{if(e&&e.name==="AbortError")return;console.error(e);
    if(SHARE_TEXT){SHARE_TEXT=false;toast("Tap Send via Outlook once more",5000)}else toast("Share menu not available – use the Backup button",6000)})}
function sendOutlookLink(){const d=CUR;const run=f=>{downloadBlob(f,fileName(d));copyAddr();
    const q=`?to=${encodeURIComponent(recipient())}&subject=${encodeURIComponent(subject(d))}&body=${encodeURIComponent(bodyText(d,1700))}`;
    const mailto=`mailto:${encodeURIComponent(recipient())}?subject=${encodeURIComponent(subject(d))}&body=${encodeURIComponent(bodyText(d,1700))}`;
    toast("PDF saved – attach it to the email before sending",6000);
    setTimeout(()=>{if(isMobile()){let left=false;const v=()=>{if(document.hidden)left=true};document.addEventListener("visibilitychange",v);
      location.href="ms-outlook://compose"+q;setTimeout(()=>{document.removeEventListener("visibilitychange",v);if(!left)location.href=mailto},1600)}else location.href=mailto},700)};
  if(PDFFILE)run(PDFFILE);else buildPDF(d).then(run).catch(e=>{console.error(e);toast("Could not create the PDF")})}
async function savePDF(){try{const blob=PDFFILE||await buildPDF(CUR);downloadBlob(blob,fileName(CUR));toast("PDF saved")}catch(e){console.error(e);toast("Could not create the PDF")}}
/* ---------- direct send (one tap) with Outbox ---------- */
function blobToB64(b){return new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(",")[1]);f.onerror=rej;f.readAsDataURL(b)})}
async function sendDirect(){const d=CUR;const b=$("#bShare");if(!PDFFILE){toast("Report still being prepared – tap again in a moment");return}
  if(b){b.disabled=true;b.innerHTML='<span class="sending"><span class="spin"></span>Sending…</span>'}
  try{const t=tabByNum(d.tab);const s=stats(d);
    const item={id:d.id,queuedAt:Date.now(),tries:0,title:`${pad(t.num)} – ${t.short}`,reportId:reportId(d),location:d.details.location,ua:s.UA,ni:s.NI,snn:s.snnN,
      payload:{uid:d.id,reportId:reportId(d),to:recipient(),subject:subject(d),text:bodyText(d),html:htmlBody(d),filename:fileName(d),pdf:await blobToB64(PDFFILE)}};
    await dbPut("outbox",item);await dbDel("drafts",d.id);
    const r=await sendItem(item);
    if(r.ok){toast("✓ Report sent to the SHE Manager",4500)}else toast("No connection – report saved in the Outbox and will send automatically",6500);
    go("#home")}catch(e){console.error(e);toast("Could not send – report kept. Try again or use Other ways to send",6500);if(b){b.disabled=false;b.textContent="Send report"}}}
async function relayPost(item,noCors){const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),60000);
  try{const r=await fetch(RELAY.url,{method:"POST",body:JSON.stringify({...item.payload,key:RELAY.key}),signal:ctl.signal,redirect:"follow",...(noCors?{mode:"no-cors"}:{})});
    if(noCors)return {ok:true,unconfirmed:true};const j=await r.json().catch(()=>({ok:false,error:"Bad reply"}));return j}finally{clearTimeout(tm)}}
async function sendItem(item){if(!directOn())return {ok:false,error:"Direct send not set up"};
  if(navigator.onLine===false)return {ok:false,error:"Offline"};
  let res;try{res=await relayPost(item,false)}catch(e){
    // CORS-blocked replies still deliver the email; a second no-cors attempt is safe because the relay ignores duplicates.
    if(e&&e.name!=="AbortError"&&navigator.onLine!==false){try{res=await relayPost(item,true)}catch(e2){res={ok:false,error:String(e2)}}}else res={ok:false,error:String(e)}}
  if(res&&res.ok){await dbPut("sent",{id:item.id,reportId:item.reportId,title:item.title,location:item.location,sentAt:Date.now(),ua:item.ua,ni:item.ni,snn:item.snn,via:res.unconfirmed?"direct*":"direct"});
    await dbDel("outbox",item.id);return res}
  item.tries=(item.tries||0)+1;item.lastError=(res&&res.error)||"Unknown";item.lastTry=Date.now();await dbPut("outbox",item);return res||{ok:false}}
let FLUSHING=false;
async function flushOutbox(manual){if(FLUSHING)return;FLUSHING=true;let sent=0,left=0;
  try{const items=await dbAll("outbox");for(const it of items){const r=await sendItem(it);r.ok?sent++:left++}}finally{FLUSHING=false}
  if(sent)toast(`✓ ${sent} report(s) from the Outbox sent`,4000);else if(manual&&left)toast("Still no connection – will keep trying",4000);
  if(sent&&(location.hash||"#home")==="#home")viewHome();return {sent,left}}

async function markSent(){const d=CUR;if(!confirm("Confirm the email has been sent? This closes the inspection on this phone."))return;const t=tabByNum(d.tab);const s=stats(d);
  await dbPut("sent",{id:d.id,reportId:reportId(d),title:`${pad(t.num)} – ${t.short}`,location:d.details.location,sentAt:Date.now(),ua:s.UA,ni:s.NI,snn:s.snnN});
  await dbDel("drafts",d.id);toast("Inspection closed");go("#home")}

/* ---------- boot ---------- */
openDB().then(async()=>{await route();await loadRelay();if(location.hash.startsWith("#review")&&CUR)viewReview(CUR);flushOutbox()});
window.addEventListener("online",()=>flushOutbox());
document.addEventListener("visibilitychange",()=>{if(!document.hidden)flushOutbox()});
setInterval(()=>{if(navigator.onLine!==false)flushOutbox()},90000);
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
