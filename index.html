<script>
"use strict";
const CONFIG = {
  recipient: "darren.frizzell@genus.com.au",          // <-- report recipient (set once before hosting)
  project: "J1084 – Parron Wind Farm Connection Assets – Yerramullah Terminal (YMT)",
  docPrefix: "J1084-HSE-FRM-YMT-TBA", rev: "0", appVersion: "1.3"
};
const TABS = [{"num": 1, "title": "01 – Site Office, Amenities & First Aid", "short": "Site Office, Amenities & First Aid", "scope": "Site office compound, crib rooms, ablutions, first aid, AED and emergency information.", "extra": [], "sections": [{"name": "NOTICE BOARDS & SITE INFORMATION", "q": [{"id": "1.1", "text": "Is the SHE notice board current – Safety & Health and Environmental policies, latest SHEQ Alerts, monthly SHE performance, emergency contacts, HSR names and the EAP (Drake WellbeingHub 1300 135 600) – with nothing superseded or out of date?", "ref": "WHSMP App B", "snn": []}, {"id": "1.2", "text": "Does the Emergency Response Board at the pre-start area show TODAY's Chief Warden, Wardens and First Aiders by name (not last swing's), with muster points and a site map?", "ref": "ERP 6.2; BFMP 12.7", "snn": ["FND"]}, {"id": "1.3", "text": "Is the Site Emergency Quick Reference displayed in the office and crib rooms, showing the 000 address 'YMT construction site, Cowalla Road, Hill River WA 6521 – Plus Code M83P+PRV' and the meeting point at the Primary Site Entry gate?", "ref": "ERP 5; 6.2", "snn": ["FND"]}, {"id": "1.4", "text": "Is the Principal Contractor sign (Genus, Construction Manager name and 24-hour contact number) visible from OUTSIDE the site at the entry gate?", "ref": "WHSMP 6.1.1; 39.1", "snn": []}, {"id": "1.5", "text": "Are the site layout map and key single-line diagrams displayed in the site office, showing risk zones, emergency egress and DG storage locations?", "ref": "WHSMP 39.3", "snn": []}]}, {"name": "EMERGENCY & FIRE", "q": [{"id": "1.6", "text": "Walk the route: is the path to the primary muster point (south of the office compound, beyond LV parking) unobstructed, with the green muster sign in place and the alternate (west side) muster point also signed?", "ref": "ERP 8.1", "snn": ["FND"]}, {"id": "1.7", "text": "Is there a 9 kg dry powder extinguisher in EACH building (office, crib room, ablutions, store) – bracket-mounted, signed, unobstructed, gauge in the green, pin and seal intact, and quarterly inspection / 6-monthly service tag current?", "ref": "BFMP 12.5; WHSMP 37", "snn": []}, {"id": "1.8", "text": "Are exit signs installed in each transportable, and do exit doors open freely?", "ref": "ERP 7.9", "snn": []}, {"id": "1.9", "text": "Spot check 3 people on site: are they all on today's sign-in record, so a headcount at muster would match the people actually on site?", "ref": "ERP 8.2; SSMP", "snn": ["FND"]}]}, {"name": "FIRST AID & AED", "q": [{"id": "1.10", "text": "Is the AED at the site office signed, unobstructed and showing its ready indicator, with pads and battery in date and the monthly check recorded on FRM-SHEQ-GNP-0055?", "ref": "ERP 7.7; WHSMP 9.7", "snn": ["FND"]}, {"id": "1.11", "text": "Do the site office first aid and trauma kits include the remote-site additions – snake bite kit / heavy-duty 10 cm crepe bandages, large clean sheeting for burns, thermal blanket, whistle and torch – with no expired items and a current monthly inspection?", "ref": "ERP 7.9; 7.11", "snn": ["FND"]}, {"id": "1.12", "text": "Check today's ERT board against the headcount: is there at least 1 current first aider (HLTAID011) per 20 personnel on shift, at least one HLTAID014 advanced first aider, and at least one Mental Health First Aider?", "ref": "ERP 7.6", "snn": ["FND"]}, {"id": "1.13", "text": "Are eye wash bottles sealed and in date, and has the wall-mounted eye wash at the workshop & Fuel cell been flushed and tagged this month?", "ref": "ERP 7.9 Table 12", "snn": []}]}, {"name": "AMENITIES & HYGIENE", "q": [{"id": "1.14", "text": "Are toilets clean with running water, soap, hand drying, working cubicle locks, and separate female facilities with a sanitary bin – and within a 20-minute round trip of key work fronts?", "ref": "WHSMP 18.1", "snn": []}, {"id": "1.15", "text": "Is cool potable drinking water available (min. 4 L per person per day in hot weather)?", "ref": "WHSMP 18.3", "snn": []}, {"id": "1.16", "text": "Is the crib room clean, food scraps removed daily, hand wash available next to the eating area, and food bins lidded and closed so fauna is not attracted?", "ref": "WHSMP 18.4; CEMP 23", "snn": []}, {"id": "1.17", "text": "Is shade and seating provided for everyone at meal breaks (or a documented alternative such as air-conditioned vehicles)?", "ref": "WHSMP 18.1", "snn": []}, {"id": "1.18", "text": "Is the sewage holding tank within capacity (no overflow or odour), with the last pump-out docket from the licensed carrier on file?", "ref": "CEMP 26.2; WMP", "snn": []}, {"id": "1.19", "text": "Are kettles, fridges, microwaves, chargers and power boards in the office and crib room test-tagged in the current colour, with no piggy-backed or daisy-chained power boards?", "ref": "WHSMP 27.2", "snn": []}, {"id": "1.20", "text": "Are tops of cabinets and shelves beside walkways clear of items that could fall, and is lighting adequate on outside steps and in parking areas for dawn starts?", "ref": "WHSMP 18.1; TMP 8.12", "snn": []}]}]}, {"num": 2, "title": "02 – Housekeeping, Access & Egress, Signage & Security", "short": "Housekeeping, Access & Egress, Signage & Security", "scope": "Walkways, laydowns, material storage, waste and combustibles, signage, gate and compound security.", "extra": [], "sections": [{"name": "WALKWAYS, ACCESS & EGRESS", "q": [{"id": "2.1", "text": "Are walkways, stairs, ramps and access tracks free of off-cuts, packaging, tools, hoses and leads – nothing left lying across a path?", "ref": "WHSMP 38.1", "snn": []}, {"id": "2.2", "text": "Where leads, hoses or cables cross walkways or vehicle routes, are they elevated on stands / hangers or protected by cable ramps?", "ref": "WHSMP 38.1; 27.2", "snn": []}, {"id": "2.3", "text": "Do transportable building stairs and landings have handrails, non-slip treads and no loose, bent or damaged steps?", "ref": "WHSMP 38.1", "snn": []}, {"id": "2.4", "text": "Is lighting adequate for safe walking and driving at the compound, parking and any work front operating in low light?", "ref": "TMP 8.12", "snn": []}]}, {"name": "LAYDOWN & MATERIAL STORAGE", "q": [{"id": "2.5", "text": "Are materials stored only inside the designated laydown, stacked stable (banded, chocked, no leaning loads) and NOT encroaching on firebreaks, DG bunds, refuelling areas, extinguisher access or egress routes?", "ref": "WHSMP 38.1", "snn": []}, {"id": "2.6", "text": "Are cable and conductor drums chocked and secured against rolling, on level hardstand?", "ref": "SSMP App A", "snn": []}, {"id": "2.7", "text": "Is there a marked, clear route between laydown rows wide enough for the telehandler / forklift, with pedestrians kept separate from the loading zone?", "ref": "TMP 8.7; 8.9", "snn": ["TMP"]}, {"id": "2.8", "text": "Are copper, cable and conductor off-cuts and other high-theft items in the locked compound or locked scrap bin?", "ref": "SSMP; WMP", "snn": []}]}, {"name": "WASTE & COMBUSTIBLES", "q": [{"id": "2.9", "text": "Are cardboard, timber off-cuts, pallets and packaging removed daily during the Restricted Burning Period and NOT stacked against buildings, fences or within the 10 m APZ?", "ref": "WHSMP 38.1; BFMP 8.7", "snn": []}, {"id": "2.10", "text": "Are bins labelled by waste stream, on hardstand, lids closed and less than three-quarters full, with no wind-blown litter around them?", "ref": "WMP; CEMP 23", "snn": []}, {"id": "2.11", "text": "Was every work front left clean at the end of the previous shift – no abandoned materials, equipment or waste?", "ref": "WHSMP 38.1", "snn": []}]}, {"name": "SIGNAGE", "q": [{"id": "2.12", "text": "Is the site entrance sign complete: project name/number, Principal Contractor, CM name & contact, 24-hr emergency number, mandatory PPE, 'Authorised Personnel Only – Report to Site Office' and visitor sign-in instructions?", "ref": "WHSMP 39.1", "snn": []}, {"id": "2.13", "text": "Are safety-critical signs (emergency, electrical, DG/HAZCHEM, muster) present and legible? (Missing/faded safety-critical signs replaced within 24 h; other signs within 48 h.)", "ref": "WHSMP 39.4", "snn": []}, {"id": "2.14", "text": "Is hazard signage posted AT the hazard – open excavations, overhead power lines (DANGER + 'Look Up and Live'), rotating machinery, hearing / eye protection zones?", "ref": "WHSMP 39.2", "snn": []}]}, {"name": "SITE SECURITY & END OF SHIFT", "q": [{"id": "2.15", "text": "Is the primary entry gate either closed and locked (entry by UHF / phone call-up) OR staffed by a Genus worker while open?", "ref": "SSMP; TMP 6.3", "snn": []}, {"id": "2.16", "text": "Is the 1.8 m compound / laydown fencing intact – no gaps, leaning panels, missing clamps or bases – with lockable gates?", "ref": "SSMP", "snn": []}, {"id": "2.17", "text": "Are visitors escorted at all times by an inducted person, wearing a visitor pass and full PPE, and recorded in the visitor register?", "ref": "WHSMP 36; SSMP", "snn": []}, {"id": "2.18", "text": "Are farm gates on access routes left as found / closed behind vehicles, with any gate found open reported to the Land Access Coordinator?", "ref": "TMP 6.7; SSMP", "snn": []}]}]}, {"num": 3, "title": "03 – Worker Conduct, PPE & Fitness for Work", "short": "Worker Conduct, PPE & Fitness for Work", "scope": "Behavioural observation of workers and crews: PPE, fitness for work, site rules and Safety Non-Negotiables.", "extra": [], "sections": [{"name": "PPE", "q": [{"id": "3.1", "text": "Is every person wearing minimum PPE – long-sleeved 100% cotton hi-vis shirt buttoned to the wrist and long trousers (or overalls), safety boots, safety glasses, gloves, and hard hat where required?", "ref": "WHSMP 37", "snn": ["FND"]}, {"id": "3.2", "text": "Are workers within 3 m of live electrical apparatus wearing minimum 6.5 cal/cm² arc-rated clothing, and non-metal capped boots in electrical areas?", "ref": "WHSMP 37; 39.2", "snn": ["FND", "EI"]}, {"id": "3.3", "text": "Is the task PPE in the SWMS / JHA / SDS actually being worn – e.g. hearing protection in signed >85 dB(A) zones, P2 respirator when cutting or grinding concrete, face shield when grinding, chemical gloves when decanting?", "ref": "WHSMP 20.3; 20.5; HSDG 14", "snn": ["FND"]}, {"id": "3.4", "text": "Is PPE in good condition and worn correctly – hard hats in date and undamaged, glasses unscratched, gloves suited to the task, hearing protection fitted properly?", "ref": "WHSMP 37", "snn": ["FND"]}]}, {"name": "FITNESS FOR WORK", "q": [{"id": "3.5", "text": "Does today's sign-on record show EVERY person on site (including visitors and delivery drivers) completed the daily breath alcohol test with a 0.000 result?", "ref": "WHSMP 15.2.2", "snn": ["FFW"]}, {"id": "3.6", "text": "On hot days, are heat controls in place – shade, a cool zone (air-conditioned vehicle), water at the work front, work–rest cycles, and no heavy outdoor work 11:00–16:00 at 42 °C or above?", "ref": "WHSMP 17; ERP 10.2.5", "snn": []}]}, {"name": "BEHAVIOURS & SITE RULES", "q": [{"id": "3.7", "text": "Ask to see it: did each worker complete a Take 5 BEFORE starting their task, and redo it when conditions or location changed?", "ref": "WHSMP 5.2", "snn": ["FND"]}, {"id": "3.8", "text": "Can workers explain their Stop Work Authority and give an example of when they would use it?", "ref": "WHSMP 8.9", "snn": ["FND"]}, {"id": "3.9", "text": "Is smoking / vaping only in designated areas (at least 10 m from vegetation, fuel, chemicals and electrical infrastructure, with a lidded butt bin) – never in vehicles, buildings or plant?", "ref": "WHSMP 20.2; BFMP 8.6", "snn": []}, {"id": "3.10", "text": "Are mobile phones used only when the vehicle or plant is stationary with the engine off – not while operating, spotting or inside an exclusion zone?", "ref": "TMP 8.2", "snn": ["VD"]}, {"id": "3.11", "text": "Are tools used as the manufacturer intends – no makeshift tools, removed guards or tools used beyond their rating?", "ref": "WHSMP 31.4", "snn": ["FND"]}, {"id": "3.12", "text": "Is the workplace respectful and free from bullying, harassment and discrimination, with any concerns raised by workers recorded and escalated under the Genus Code of Conduct?", "ref": "WHSMP 16.2", "snn": ["FFW"]}, {"id": "3.13", "text": "Spot check one crew: are they following the permit, isolation and SWMS requirements for the high-risk work they are doing?", "ref": "WHSMP 8.6; 24", "snn": ["FND", "EI"]}, {"id": "3.14", "text": "Is supervision within 1 Supervisor : 15 workers on each work front, with apprentices and trainees supervised per PRO-HRM-GNP-0010?", "ref": "WHSMP 5.1; 5.5", "snn": []}, {"id": "3.15", "text": "Ask 2 workers: do they know today's muster point for their work front and the site emergency channel (UHF 24)?", "ref": "ERP 8.1; 11.1", "snn": ["FND"]}]}]}, {"num": 4, "title": "04 – SWMS, JHA (TBRA) & Take 5", "short": "SWMS, JHA (TBRA) & Take 5", "scope": "Quality and use of SWMS, JHA / DTRMP and Take 5 at the work front.", "extra": ["SWMS No(s):", "JHA No:"], "sections": [{"name": "SWMS", "q": [{"id": "4.1", "text": "Is there a current, Construction Manager-approved SWMS AT the work location for each HRCW activity underway – e.g. work near energised apparatus, excavation >1.5 m, mobile plant movement, work at height >2 m?", "ref": "WHSMP 8.6; 8.6.1", "snn": ["FND"]}, {"id": "4.2", "text": "Have ALL crew members, including the Supervisor, signed onto the SWMS, or onto the JHA that records the SWMS number?", "ref": "WHSMP 8.6", "snn": ["FND"]}, {"id": "4.3", "text": "Check the review record: has the SWMS been reviewed in the last month and after any change to the work, controls, crew or plant?", "ref": "WHSMP 8.6", "snn": ["FND"]}]}, {"name": "JHA / DTRMP", "q": [{"id": "4.4", "text": "Is a JHA completed for TODAY's task, with job steps, what can go wrong, controls and who is responsible for each step – not a copy of yesterday's?", "ref": "WHSMP 8.8", "snn": ["FND"]}, {"id": "4.5", "text": "Walk the task: does the JHA match what the crew is actually doing now – same steps, plant, location and crew?", "ref": "WHSMP 8.8", "snn": ["FND"]}, {"id": "4.6", "text": "Does the JHA record the muster point for this work front (temporary muster marked with a green cone where remote) and the emergency / rescue arrangements for the task?", "ref": "ERP 8.1", "snn": ["FND"]}, {"id": "4.7", "text": "Has every person in the work group signed the JHA?", "ref": "WHSMP 8.8", "snn": ["FND"]}, {"id": "4.8", "text": "Has the Supervisor reviewed and signed the JHA?", "ref": "WHSMP 8.8", "snn": ["FND"]}, {"id": "4.9", "text": "Where a permit is required, is the permit number on the JHA and the permit kept with the JHA at the work location?", "ref": "WHSMP 24", "snn": ["FND"]}, {"id": "4.10", "text": "Have SDS controls for chemicals used in the task (PPE, ventilation, first aid) been carried into the JHA?", "ref": "HSDG 9; 14", "snn": ["FND"]}, {"id": "4.11", "text": "Where the task involves SIMOPS with Related Works (e.g. Vestas) or Western Power, are the shared exclusion zones, permits and energisation status recorded on the JHA and briefed at a joint pre-start?", "ref": "WHSMP 8.6.2", "snn": ["FND"]}]}, {"name": "TAKE 5", "q": [{"id": "4.12", "text": "Are Take 5s specific – hazards actually named, not 'nil', blank or ticked without content?", "ref": "WHSMP 5.2", "snn": ["FND"]}, {"id": "4.13", "text": "Were new Take 5s completed when the crew moved location, the weather changed, or new plant / people entered the area?", "ref": "WHSMP 5.2", "snn": ["FND"]}]}]}, {"num": 5, "title": "05 – Permits to Work", "short": "Permits to Work", "scope": "Validity and field implementation of Genus and Western Power permits.", "extra": ["Permit type & No:", "Permit Issuer:"], "sections": [{"name": "PERMIT VALIDITY", "q": [{"id": "5.1", "text": "Is the correct permit in place for the work observed – Hot Work (FRM-SHEQ-GNP-0042), Working at Heights / EWP (FRM-SHEQ-GNP-0041), Excavation (FRM-SHEQ-GNP-0043), Confined Space (FRM-SHEQ-GNP-0040), or Western Power EAP / VA?", "ref": "WHSMP 24 Table 23", "snn": ["FND"]}, {"id": "5.2", "text": "Is the permit valid for TODAY's date and time, this location and this specific task – not expired or covering a different area?", "ref": "WHSMP 24", "snn": ["FND"]}, {"id": "5.3", "text": "Are blank fields and unused signature boxes struck out so nothing can be added later?", "ref": "WHSMP 24", "snn": ["FND"]}, {"id": "5.4", "text": "If the permit was transferred at shift change, is the handover documented and signed by the incoming holder?", "ref": "WHSMP 24", "snn": ["FND"]}]}, {"name": "PERMIT IN THE FIELD", "q": [{"id": "5.5", "text": "Has every worker under the permit signed on, and can a worker you ask describe the permit conditions?", "ref": "WHSMP 24", "snn": ["FND"]}, {"id": "5.6", "text": "Is the permit (or copy) displayed / kept at the work front with the JHA?", "ref": "WHSMP 39.2; BFMP 8.2", "snn": ["FND"]}, {"id": "5.7", "text": "Check each control written on the permit: is it physically in place (e.g. fire watch, barricades, gas test, extinguisher, spotter) – not just signed for?", "ref": "WHSMP 24", "snn": ["FND"]}, {"id": "5.8", "text": "Where hazardous energy is involved, has positive verification of zero energy (test for dead / try start) been recorded before work started?", "ref": "WHSMP 26", "snn": ["FND", "EI"]}, {"id": "5.9", "text": "Where work interfaces with Western Power assets, is the WP permit (EAP / VA) in place and the Genus permit bridged to it, with the more stringent requirement applied?", "ref": "WHSMP 24", "snn": ["FND", "EI"]}, {"id": "5.10", "text": "Is coordination with other permits and crews in the same area recorded (e.g. hot work above a laydown, lifting over an excavation, SIMOPS)?", "ref": "WHSMP 8.6.2", "snn": ["FND"]}, {"id": "5.11", "text": "Are the emergency / rescue requirements on the permit specified, and are those resources actually present (rescue kit, standby person, firefighting appliance)?", "ref": "WHSMP 24; ERP 9", "snn": ["FND"]}]}, {"name": "CLOSE-OUT", "q": [{"id": "5.12", "text": "Are completed permits closed out (area inspected, made safe and signed off) and filed in the permit register for the Principal?", "ref": "WHSMP 24", "snn": ["FND"]}]}]}, {"num": 6, "title": "06 – Isolation & Lock Out Tag Out", "short": "Isolation & Lock Out Tag Out", "scope": "Energy isolation, personal danger locks and tags, out of service tags and the Western Power interface.", "extra": ["Isolation / Permit No:", "Isolating Officer:"], "sections": [{"name": "ISOLATION SET-UP", "q": [{"id": "6.1", "text": "Is the isolation documented (permit / isolation register) listing EVERY isolation point, and does the equipment isolated match the plant actually being worked on?", "ref": "WHSMP 26", "snn": ["EI"]}, {"id": "6.2", "text": "Was the isolation carried out by a person trained and competent for that level of isolation (GNP Permit to Work and Isolation training)?", "ref": "WHSMP 26; TIP 16", "snn": ["EI", "FND"]}, {"id": "6.3", "text": "At each isolation point: is the device in the isolated position (switch off, valve closed, no indicator lights) with a lock and danger tag fitted?", "ref": "WHSMP 26.1", "snn": ["EI"]}, {"id": "6.4", "text": "Was isolation proven by a test (test for dead / try start / pressure release) with personnel moved clear before the test – and is the result recorded?", "ref": "WHSMP 26", "snn": ["EI"]}, {"id": "6.5", "text": "Is stored energy dissipated or controlled – capacitors discharged, hydraulic / pneumatic pressure released, gravity and spring loads blocked, DC batteries isolated?", "ref": "WHSMP 26", "snn": ["EI"]}]}, {"name": "PERSONAL LOCKS & TAGS", "q": [{"id": "6.6", "text": "Count them: does EVERY worker under the isolation have their own personal danger lock and tag fitted (directly or on the lock box), matching the names signed on?", "ref": "WHSMP 26.1", "snn": ["EI"]}, {"id": "6.7", "text": "Are personal danger tags completed in full – name, date, equipment and contact?", "ref": "WHSMP 26.1", "snn": ["EI"]}, {"id": "6.8", "text": "Where a lock box is used, are all isolation keys inside it and all personal locks on the box?", "ref": "WHSMP 26.1", "snn": ["EI"]}, {"id": "6.9", "text": "Is defective plant withdrawn from service with an Out of Service tag – and are information tags never used in place of a danger or out of service tag?", "ref": "WHSMP 26.1", "snn": ["EI"]}, {"id": "6.10", "text": "Has any personal lock been removed by someone other than its owner? If so, was it authorised by the Senior Site Official under the documented removal process?", "ref": "WHSMP 26.1", "snn": ["EI"]}]}, {"name": "WESTERN POWER & HV INTERFACE", "q": [{"id": "6.11", "text": "For work on Western Power apparatus, is it under a WP Electrical Access Permit, with network isolation and earthing applied by Western Power as Ultimate Switching Authority?", "ref": "WHSMP 24; 27", "snn": ["EI"]}, {"id": "6.12", "text": "During cut-in outage work, are adjacent energised circuits treated as live and MADs maintained?", "ref": "TMP 8.17", "snn": ["EI"]}, {"id": "6.13", "text": "Ask one worker to explain the isolation steps: is the procedure available at the workplace and understood by the crew?", "ref": "WHSMP 26", "snn": ["EI"]}, {"id": "6.14", "text": "Are shared isolation points and other activities (SIMOPS) coordinated so one crew's isolation cannot be released by another?", "ref": "WHSMP 8.6.2", "snn": ["EI"]}, {"id": "6.15", "text": "At shift change, do isolations, locks and permits stay intact or get formally transferred with documentation?", "ref": "WHSMP 24", "snn": ["EI"]}]}]}, {"num": 7, "title": "07 – Energised Apparatus & Western Power Access", "short": "Energised Apparatus & Western Power Access", "scope": "Work on or near energised 330 kV apparatus and overhead lines, Western Power authorisations, earthing and bonding.", "extra": ["WP Permit No (EAP / VA):", "Safety Observer:"], "sections": [{"name": "AUTHORISATION & PERMITS", "q": [{"id": "7.1", "text": "Does every person working on or near Western Power assets hold a current WP Network Authority Card and the required WP induction?", "ref": "TIP Table 16; TMP 7.5", "snn": ["EI", "FND"]}, {"id": "7.2", "text": "Is there at least one RIC (Transmission) in each work party where required?", "ref": "TIP Table 16", "snn": ["EI"]}, {"id": "7.3", "text": "Is a Vicinity Access (VA) permit in place for work in the danger zone / where MAD encroachment is possible – and an EAP for work on isolated and earthed apparatus?", "ref": "WHSMP 24 Table 23", "snn": ["EI"]}, {"id": "7.4", "text": "Is the MAD for 330 kV stated on the permit / JHA, and can the crew tell you what it is?", "ref": "WHSMP 27.1", "snn": ["EI"]}]}, {"name": "OVERHEAD LINES & PLANT", "q": [{"id": "7.5", "text": "Is every crossing under an overhead line goalposted on BOTH approaches (non-conductive, max height signed) with a DANGER sign and 'Look Up and Live' signs?", "ref": "TMP 8.17; WHSMP 39.2", "snn": ["EI", "TMP"]}, {"id": "7.6", "text": "Is all plant travelling lowered / stowed (tipper down, booms stowed, jibs retracted) – no elevated travel anywhere on site?", "ref": "TMP 8.17", "snn": ["EI", "TMP"]}, {"id": "7.7", "text": "Is elevated plant within reach of a conductor working to a CM-approved lift / work plan that sets the clearances, with a dedicated trained safety observer?", "ref": "TMP 8.17", "snn": ["EI"]}, {"id": "7.8", "text": "Are boom-type EWPs near electrical apparatus or in WP vicinity zones operated ONLY by qualified linespersons?", "ref": "WHSMP 29 Table 24", "snn": ["EI"]}, {"id": "7.9", "text": "At end of shift, is all plant, vehicles and material outside the MAD exclusion zone of the in-service line?", "ref": "SSMP App A", "snn": ["EI"]}]}, {"name": "EARTHING, BONDING & EQUIPMENT", "q": [{"id": "7.10", "text": "Are metallic fencing, buildings, posts, plant and generators inside the substation or near HV lines bonded to earth per Western Power requirements?", "ref": "WHSMP 27; SSMP", "snn": ["EI"]}, {"id": "7.11", "text": "Are star pickets and plastic barrier tape ABSENT from inside energised substations?", "ref": "SSMP", "snn": ["EI"]}, {"id": "7.12", "text": "Are ONLY non-conductive (fibreglass) platform ladders to AS/NZS 1892.3/.5 used in the substation and near live conductors?", "ref": "WHSMP 27", "snn": ["EI"]}, {"id": "7.13", "text": "Is insulated PPE and test equipment (HV gloves, operating sticks, voltage detectors) marked with its next test date – and is it in date?", "ref": "WHSMP 27", "snn": ["EI"]}, {"id": "7.14", "text": "During stringing / conductor work near energised lines, are the induced-voltage controls in the SWMS (e.g. running earths, equipotential zones) installed as written?", "ref": "WHSMP 4.2; SWMS-0010", "snn": ["EI"]}]}, {"name": "COMMUNICATIONS & RESCUE", "q": [{"id": "7.15", "text": "Listen in: are apparatus named in full, and are radio / phone instructions repeated back before acting?", "ref": "WHSMP 27", "snn": ["EI"]}, {"id": "7.16", "text": "Do workers exposed to live LV panels hold LV rescue (UETDRMP018) and CPR within 12 months, with an LV rescue kit at the work location?", "ref": "TIP Table 16", "snn": ["EI"]}, {"id": "7.17", "text": "Are the WP Incident Hotline (1300 225 597) and WP faults (13 13 51) on the ERB and known to the permit holder?", "ref": "ERP App A", "snn": ["FND"]}, {"id": "7.18", "text": "For PRW Substation work, has the crew been inducted into PRW site rules and the emergency arrangements bridged with the Principal / Vestas?", "ref": "ERP 8.4", "snn": ["FND"]}]}]}, {"num": 8, "title": "08 – Electrical Equipment & Temporary Power", "short": "Electrical Equipment & Temporary Power", "scope": "Portable electrical equipment, leads, RCDs, temporary switchboards, generators and portable rotating tools.", "extra": [], "sections": [{"name": "TEST & TAG, RCDS", "q": [{"id": "8.1", "text": "Does every portable tool, lead and power board carry a test tag in the CURRENT colour (RGBY) and appear on the electrical register?", "ref": "WHSMP 27.2", "snn": ["EI"]}, {"id": "8.2", "text": "Are RCDs used on all portable tools, leads, generators and GPOs, and has each RCD been tested this quarter with the result recorded?", "ref": "WHSMP 27.2", "snn": ["EI"]}, {"id": "8.3", "text": "Are plugs, sockets and leads free of damage – no cracked plugs, exposed conductors, taped joins or repairs by non-electricians?", "ref": "WHSMP 27.2", "snn": ["EI"]}, {"id": "8.4", "text": "Is faulty equipment tagged Out of Service and moved to a designated quarantine area for repair by a licensed electrician only?", "ref": "WHSMP 26.1; 27.2", "snn": ["EI"]}]}, {"name": "LEADS & TEMPORARY INSTALLATIONS", "q": [{"id": "8.5", "text": "Are leads up on non-conductive lead stands or insulated hangers (or under cable ramps), out of water, not through doorways or over sharp edges?", "ref": "WHSMP 27.2", "snn": []}, {"id": "8.6", "text": "Are leads NOT tied or hooked directly onto scaffolding, handrails or steel structures?", "ref": "WHSMP 27.2", "snn": []}, {"id": "8.7", "text": "Are temporary switchboards to AS/NZS 3012 – doors closed and lockable, RCD-protected outlets, weatherproof and labelled?", "ref": "BFMP 8.5", "snn": ["EI"]}, {"id": "8.8", "text": "Are generators and lighting towers bunded / self-bunded, on hardstand within a 10 m APZ with grass kept low, and earthed per the OEM?", "ref": "BFMP 8.5; CEMP 24", "snn": []}, {"id": "8.9", "text": "Is DC battery work in ventilated areas, with no ignition sources, an acid spill kit and eye wash present?", "ref": "HSDG 14; BFMP 8.5", "snn": []}, {"id": "8.10", "text": "Is tool battery / lithium charging done on a non-combustible surface at a designated charging station?", "ref": "HSDG App A", "snn": []}]}, {"name": "PORTABLE ROTATING TOOLS", "q": [{"id": "8.11", "text": "Are portable grinders 125 mm (5-inch) maximum – 230 mm prohibited – with both handles fitted and guards set to throw sparks away from the operator?", "ref": "WHSMP 31.4.1", "snn": ["FND"]}, {"id": "8.12", "text": "Is the right disc fitted for the task (cutting disc for cutting, grinding disc for grinding), rated for the tool speed, with chipped or cracked discs binned?", "ref": "WHSMP 31.4.1", "snn": ["FND"]}, {"id": "8.13", "text": "Are guards fitted to drills, saws and other rotating tools, and tools stored dry and protected when not in use?", "ref": "WHSMP 31.4.1", "snn": ["FND"]}]}]}, {"num": 9, "title": "09 – Working at Heights & Fall Protection", "short": "Working at Heights & Fall Protection", "scope": "Work at height planning, rescue, harnesses and anchorages, edge protection, scaffolds, ladders and falling objects.", "extra": ["WAH Permit No:", "Rescue plan ref:"], "sections": [{"name": "PLANNING & RESCUE", "q": [{"id": "9.1", "text": "Has the hierarchy been applied – could the task be done at ground level, from an EWP, scaffold or platform instead of harness / ladder?", "ref": "WHSMP 29", "snn": ["WAH"]}, {"id": "9.2", "text": "Is a Working at Heights Permit (FRM-SHEQ-GNP-0041) in place and the WAH SWMS (SWMS-SHEQ-GNP-0002)?", "ref": "WHSMP 24; 8.6.1", "snn": ["WAH", "FND"]}, {"id": "9.3", "text": "Was a task-specific rescue plan written BEFORE work started, and are at least TWO trained rescuers on site while work at height is active?", "ref": "ERP 9.3; WHSMP 29", "snn": ["WAH"]}, {"id": "9.4", "text": "Is an Emergency Descent Device kit (EDD with rope, rigging kit, spare suspension relief straps) AT the work front and inspected within the last 3 months?", "ref": "ERP 9.3", "snn": ["WAH"]}, {"id": "9.5", "text": "Do workers at height hold RIIWHS204E (within 2 years), and do rescuers for gantry / tower work hold UETDRMP009 Perform tower rescue?", "ref": "TIP Table 16; ERP 9.3", "snn": ["WAH", "FND"]}]}, {"name": "HARNESSES & ANCHORAGES", "q": [{"id": "9.6", "text": "Do harnesses, lanyards and SRLs carry the current quarterly inspection tag, and pass a pre-use check (webbing, stitching, hardware, shock absorber not deployed)?", "ref": "WHSMP 29; PRO-0016", "snn": ["WAH"]}, {"id": "9.7", "text": "Are harnesses fitted snugly (leg and chest straps done up, dorsal D-ring between the shoulder blades) and fitted with suspension trauma relief straps?", "ref": "ERP 9.1", "snn": ["WAH"]}, {"id": "9.8", "text": "Are anchorage points rated, and temporary anchorages inspected by a PUAEQU001-competent person, positioned to limit free fall?", "ref": "TIP Table 16; WHSMP 29", "snn": ["WAH"]}, {"id": "9.9", "text": "Has fall clearance been worked out so an arrested fall stops before the worker hits the ground or a lower structure?", "ref": "WHSMP 29", "snn": ["WAH"]}, {"id": "9.10", "text": "Is fall protection equipment stored clean, dry and out of direct sunlight when not in use?", "ref": "PRO-0016", "snn": ["WAH"]}]}, {"name": "EDGE PROTECTION, SCAFFOLDS & LADDERS", "q": [{"id": "9.11", "text": "Is edge protection (top rail, mid rail, toe board) installed wherever there is a fall risk of 2 m or more?", "ref": "WHSMP 29 Table 24", "snn": ["WAH"]}, {"id": "9.12", "text": "Does each scaffold have a scaffold tag at its access showing duty rating and last inspection date, inspected within the last month (FRM-SHEQ-GNP-0045), erected / altered only by licensed scaffolders?", "ref": "WHSMP 29 Table 24", "snn": ["WAH"]}, {"id": "9.13", "text": "Are ONLY industrial platform ladders (AS/NZS 1892) in use – on the ladder register, current quarterly tag, set on firm ground, 3 points of contact maintained?", "ref": "WHSMP 29 Table 24", "snn": ["WAH"]}]}, {"name": "FALLING OBJECTS & CONDITIONS", "q": [{"id": "9.14", "text": "Is the drop zone below barricaded (or a spotter posted where barricading is not practical), and are tools at height on lanyards?", "ref": "WHSMP 29.1", "snn": ["WAH"]}, {"id": "9.15", "text": "Where people must work or walk below overhead work, is overhead protection provided?", "ref": "WHSMP 29.1", "snn": ["WAH"]}, {"id": "9.16", "text": "Are weather limits applied – WAH stops at sustained wind 40 km/h or more (unless risk assessed), ALL WAH stops at 50 km/h, and the 30/30 lightning rule is used?", "ref": "ERP 10.2.1; 10.2.2", "snn": ["WAH"]}]}]}, {"num": 10, "title": "10 – Elevating Work Platforms (EWP)", "short": "Elevating Work Platforms (EWP)", "scope": "Boom, scissor and vertical lift EWPs – competency, condition, set-up and operation.", "extra": ["EWP asset No / model:", "Type (boom / scissor / vertical):"], "sections": [{"name": "COMPETENCY & AUTHORISATION", "q": [{"id": "10.1", "text": "Does the operator hold an HRWL (WP) for a boom of 11 m or more, or a current EWP VOC (VOC-SHEQ-GNP-0005) for other EWPs?", "ref": "WHSMP 29; TIP 16", "snn": ["WAH", "FND"]}, {"id": "10.2", "text": "For a scissor / vertical lift run by a non-linesperson, are ALL of these in place: (a) CM approval, (b) VOC, (c) OEM / hire plant RA for this make and model, (d) rescue plan TEM-SHEQ-GNP-0018 with a ground spotter competent in emergency lowering, (e) JHA FRM-SHEQ-GNP-0073 and WAH permit, (f) location outside any MAD / vicinity zone?", "ref": "WHSMP 29 Table 24", "snn": ["WAH"]}, {"id": "10.3", "text": "Is a boom EWP near electrical apparatus or in a WP vicinity zone operated only by a qualified linesperson?", "ref": "WHSMP 29 Table 24", "snn": ["EI"]}]}, {"name": "MACHINE CONDITION", "q": [{"id": "10.4", "text": "Has today's documented pre-start been completed, with defects recorded and actioned?", "ref": "WHSMP 31", "snn": ["FND"]}, {"id": "10.5", "text": "Was the hire EWP inspected before first use on site, and is the periodic inspection current in the logbook?", "ref": "WHSMP 29 Table 24", "snn": ["FND"]}, {"id": "10.6", "text": "Is the secondary guarding / crush protection device fitted and working?", "ref": "WHSMP 29 Table 24", "snn": ["FND"]}, {"id": "10.7", "text": "Ask them to show you: do BOTH the operator and spotter know the ground controls and emergency lowering, and do they work?", "ref": "WHSMP 29; ERP 9.2", "snn": ["WAH"]}, {"id": "10.8", "text": "Is a fire extinguisher readily accessible to the spotter and within its test date?", "ref": "BFMP 12.5", "snn": ["WAH", "FND"]}, {"id": "10.9", "text": "Is the unit rated for outdoor use (indoor-rated units are not used outdoors), with the SWL plate legible and platform load not exceeded?", "ref": "ERP 10.2.2", "snn": ["WAH"]}]}, {"name": "SET-UP & OPERATION", "q": [{"id": "10.10", "text": "Is the EWP on firm, level ground within OEM slope limits, outriggers on pads, clear of excavation edges, pits and voids?", "ref": "WHSMP 29 Table 24", "snn": ["WAH"]}, {"id": "10.11", "text": "Is the area barricaded and signed, covering the ground under the platform AND the outriggers?", "ref": "WHSMP 29 Table 24", "snn": ["WAH"]}, {"id": "10.12", "text": "Is a spotter at ground level whenever anyone is elevated, with radio or line-of-sight contact?", "ref": "WHSMP 29 Table 24", "snn": ["WAH"]}, {"id": "10.13", "text": "In boom EWPs, are occupants harnessed to the platform anchor point – and nobody climbing the rails or leaving the platform at height without a documented control?", "ref": "WHSMP 29", "snn": ["WAH"]}, {"id": "10.14", "text": "Are tools and materials secured / tethered and the platform free of clutter?", "ref": "WHSMP 29.1", "snn": ["WAH"]}, {"id": "10.15", "text": "Is wind checked, with EWP work stopped at sustained 40 km/h or the OEM limit if lower?", "ref": "ERP 10.2.2", "snn": ["WAH"]}, {"id": "10.16", "text": "Is the EWP used only as a work platform – not as a crane or to lift materials beyond the platform rating?", "ref": "WHSMP 29", "snn": ["WAH"]}]}]}, {"num": 11, "title": "11 – Cranes & Lifting Operations", "short": "Cranes & Lifting Operations", "scope": "Mobile cranes, HIABs and lifting operations – planning, competency, crane condition, set-up and execution.", "extra": ["Crane make / model / rego:", "Lift description & weight:"], "sections": [{"name": "LIFT PLANNING", "q": [{"id": "11.1", "text": "Is there a lift plan / risk assessment for this lift, with the lift and set-down locations planned and marked on drawings?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "11.2", "text": "Has the lift been checked against the critical lift triggers (>80% of chart, >20 t, unknown weight, multiple cranes, over buildings / occupied areas, over or near powerlines, personnel box, no certified lift points) – and if ANY apply, is a Critical Lift Plan (FRM-SHEQ-GNP-0047) approved by the CM?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "11.3", "text": "Is the lift at or below 90% of the chart for the configuration (above 90% only with a third-party engineered critical lift plan)?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "11.4", "text": "Is an authorised Genus representative on site coordinating the lift?", "ref": "TMP 10", "snn": ["HL"]}, {"id": "11.5", "text": "Has the whole lifting crew signed the Cranage and Lifting SWMS (SWMS-SHEQ-GNP-0008)?", "ref": "WHSMP 12.2", "snn": ["HL"]}]}, {"name": "CRANE & COMPETENCY", "q": [{"id": "11.6", "text": "Does the operator hold the HRWL for the crane class and a current crane VOC, and the dogger / rigger the DG / RB / RI / RA licence the lift needs (RI or RA for multi-crane lifts)?", "ref": "TIP Table 21", "snn": ["HL", "FND"]}, {"id": "11.7", "text": "For cranes over 10 t, is the WorkSafe plant registration displayed in or near the cab and the registration number marked on the crane?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "11.8", "text": "Are the operator's manual and load chart in the cab, and today's pre-start / logbook completed?", "ref": "WHSMP 31; 33", "snn": ["HL"]}, {"id": "11.9", "text": "Are overload protection, LMI with operator display, external rated-capacity indicator and free-fall lock-out fitted and working?", "ref": "WHSMP 33", "snn": ["HL", "FND"]}, {"id": "11.10", "text": "Are hook safety latches, upper / lower limits and the emergency stop functional?", "ref": "WHSMP 33", "snn": ["HL", "FND"]}]}, {"name": "SET-UP & EXECUTION", "q": [{"id": "11.11", "text": "Have ground conditions been assessed, outriggers fully extended on adequate pads / timbers, and the crane set up clear of excavations and trenches?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "11.12", "text": "Is the slew radius and load path barricaded as an exclusion zone, with nobody under the suspended load?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "11.13", "text": "Are dry, non-conductive tag lines (e.g. natural fibre) used to control the load?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "11.14", "text": "Is the communication method agreed and working between operator and dogger (radio channel or hand signals)?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "11.15", "text": "Where any part of the crane or load could approach an overhead line, does the lift plan set the clearances, is a safety observer posted, and is a WP VA in place if the no-go zone could be entered?", "ref": "TMP 8.17", "snn": ["HL", "EI"]}, {"id": "11.16", "text": "Is wind monitored, with lifting stopped at sustained 32 km/h or more unless the crane chart permits?", "ref": "ERP 10.2.2", "snn": ["HL"]}, {"id": "11.17", "text": "Is the lifting gear for this lift tagged, inspected and within WLL for the load (see Lifting Gear tab)?", "ref": "WHSMP 33", "snn": ["HL"]}]}]}, {"num": 12, "title": "12 – Lifting Gear & Attachments", "short": "Lifting Gear & Attachments", "scope": "Slings, chains, shackles, chain blocks, spreader bars, HIAB and telehandler attachments – register, tagging, condition and storage.", "extra": ["Storage location / crew:", "Register ref:"], "sections": [{"name": "REGISTER & IDENTIFICATION", "q": [{"id": "12.1", "text": "Is ALL lifting gear (slings, chains, shackles, spreader bars, chain blocks, lifting clamps) on the Lifting Equipment Inspection Register?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "12.2", "text": "Does every item carry the CURRENT quarterly colour tag (RGBY) for this period?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "12.3", "text": "Is the WLL / SWL clearly marked and legible on every sling, chain and shackle – no unlabelled synthetic slings?", "ref": "WHSMP 33", "snn": ["HL"]}]}, {"name": "CONDITION & USE", "q": [{"id": "12.4", "text": "Is gear checked by the user before each use – no cuts, abrasion, heat damage, stretched or nicked links, opened hooks or missing latches?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "12.5", "text": "Is defective gear tagged out, quarantined and destroyed so it cannot go back into service?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "12.6", "text": "Is gear used within its rating – correct sling angle factors, packing on sharp edges, no knotted slings, no back-hooked chain blocks?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "12.7", "text": "Are lifting points on loads certified / rated (or the lift treated as a critical lift where they are not)?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "12.8", "text": "Are vehicle loading cranes (HIAB) inspected, outriggers deployed, and operated by licensed / VOC'd operators?", "ref": "WHSMP 33 Table 25", "snn": ["HL"]}, {"id": "12.9", "text": "Are telehandler / forklift attachments (jibs, hooks, fork extensions) rated, marked and approved for that machine on its load chart?", "ref": "WHSMP 33", "snn": ["HL"]}]}, {"name": "STORAGE", "q": [{"id": "12.10", "text": "Is lifting gear stored off the ground, under cover, away from chemicals, heat and sharp edges (sling rack or dedicated bin)?", "ref": "WHSMP 33", "snn": ["HL"]}, {"id": "12.11", "text": "Are materials waiting to be lifted stored stable on dunnage, with lift points accessible?", "ref": "WHSMP 38.1", "snn": ["HL"]}]}]}, {"num": 13, "title": "13 – Mobile Plant & the 50 / 20 / 10 Rule", "short": "Mobile Plant & the 50 / 20 / 10 Rule", "scope": "Earthmoving and mobile plant – pre-start, safety features, operator competency and plant–pedestrian interaction.", "extra": ["Plant No / type:", "Operator:"], "sections": [{"name": "PRE-START & CONDITION", "q": [{"id": "13.1", "text": "Is the asset-specific pre-start completed THIS shift, with defects recorded and safety-critical defects tagged Out of Service until repaired?", "ref": "WHSMP 31", "snn": ["TMP", "FND"]}, {"id": "13.2", "text": "Did the plant pass the site compliance inspection before mobilisation, and is servicing current in the fleet database?", "ref": "WHSMP 31", "snn": ["TMP"]}, {"id": "13.3", "text": "Are these present and working: headlights, amber beacon, reversing alarm, horn, identified isolation point, 3-point access steps / grab handles, guarding on moving parts, and a UHF radio on channel 24?", "ref": "WHSMP 31; TMP 8.12", "snn": ["TMP", "FND"]}, {"id": "13.4", "text": "Is an extinguisher suited to the machine fitted and in date, and any fitted fire suppression system in service?", "ref": "BFMP 8.4", "snn": []}, {"id": "13.5", "text": "Is the seatbelt fitted and worn, and ROPS / FOPS intact?", "ref": "WHSMP 31", "snn": ["TMP"]}, {"id": "13.6", "text": "Are load charts / SWL decals legible and the operator's manual in the cab?", "ref": "WHSMP 31", "snn": ["TMP"]}, {"id": "13.7", "text": "Is a portable hydrocarbon spill kit carried, with no active oil, fuel or coolant leaks?", "ref": "HSDG 18; CEMP 22", "snn": []}, {"id": "13.8", "text": "Are engine bays, exhausts and belly plates free of grass / vegetation build-up (mid-shift clean-out on High or above FDR days)?", "ref": "BFMP 8.4", "snn": []}]}, {"name": "OPERATOR & OPERATION", "q": [{"id": "13.9", "text": "Does the operator hold the licence / HRWL and a current plant VOC – or documented familiarisation for dry-hire plant – for THIS machine?", "ref": "TIP Table 21; WHSMP 31", "snn": ["TMP", "FND"]}, {"id": "13.10", "text": "Is the 50 / 20 / 10 Rule applied: positive UHF 24 call before 50 m; plant stopped and GET grounded before 20 m; operator out of the cab before anyone enters 10 m (walk-only)?", "ref": "WHSMP 31.1; TMP 8.8.1", "snn": ["TMP"]}, {"id": "13.11", "text": "Are spotters (Spotter Awareness VOC) used for reversing in shared areas, with line of sight or radio contact?", "ref": "TMP 8.11", "snn": ["TMP"]}, {"id": "13.12", "text": "Is there a current VMP for the work area showing routes, plant zones and pedestrian separation, displayed on the noticeboard and matching the ground?", "ref": "TMP 7.9", "snn": ["TMP"]}, {"id": "13.13", "text": "Are pedestrians physically separated (barriers) from plant wherever direct contact is possible?", "ref": "TMP 8.8", "snn": ["TMP"]}, {"id": "13.14", "text": "Is plant parked on hardstand / cleared ground (never on dry grass), GET grounded, park brake on and keys removed at end of shift?", "ref": "BFMP 8.4; SSMP", "snn": ["TMP"]}, {"id": "13.15", "text": "Are quick hitches and attachments locked with safety pins / locking devices engaged?", "ref": "PRO-PEV-GFM-0001", "snn": ["TMP"]}, {"id": "13.16", "text": "Is plant travelling lowered under overhead lines and kept outside the MAD?", "ref": "TMP 8.17", "snn": ["TMP", "EI"]}]}]}, {"num": 14, "title": "14 – Traffic, Light Vehicles & Journey Management", "short": "Traffic, Light Vehicles & Journey Management", "scope": "Site traffic controls, light vehicle fit-out, deliveries, journey management and the Cervantes commute.", "extra": [], "sections": [{"name": "SITE TRAFFIC CONTROLS", "q": [{"id": "14.1", "text": "Are speed signs posted at every change – 40 km/h site access and haul roads; 20 km/h wheel wash approach / visitor parking; 5 km/h through the wheel wash; 10 km/h laydown, office and car parks?", "ref": "TMP 8.4", "snn": ["TMP"]}, {"id": "14.2", "text": "Observe drivers: are speed limits obeyed, and reduced by 10 km/h on site roads at dawn and dusk (60 min either side of sunrise / sunset)?", "ref": "TMP 8.4", "snn": ["VD"]}, {"id": "14.3", "text": "Is the one-way HV loop and LV / HV separation signed and followed, with stop / give-way controls at intersections as shown in TMP Appendix B?", "ref": "TMP 8.1", "snn": ["TMP"]}, {"id": "14.4", "text": "Are LVs reverse-parked in designated bays, handbrake on, and not left running unattended?", "ref": "TMP 8.2; 8.9", "snn": ["VD"]}, {"id": "14.5", "text": "Are headlights on for every vehicle on site, and beacons on for all vehicles and plant in operational areas?", "ref": "TMP 8.12", "snn": ["VD"]}, {"id": "14.6", "text": "Are UHF 24 signage and call-up arrangements in place at the gate?", "ref": "TMP 8.5", "snn": ["TMP"]}, {"id": "14.7", "text": "Are delivery drivers signed in, inducted (J1084-HSE-FRM-YMT-0002), breath tested, and standing in the green safe zone during unloading?", "ref": "TMP 5.1; App A", "snn": ["TMP"]}, {"id": "14.8", "text": "Are haul roads and tracks watered so dust does not reduce visibility, road edges marked, and surfaces free of deep potholes and corrugations?", "ref": "TMP 8.13", "snn": ["VD"]}, {"id": "14.9", "text": "Are traffic control devices at the Cowalla Road site entry (and other TCP locations) set out per the approved TCP and inspected?", "ref": "TMP 9; App C", "snn": ["TMP"]}]}, {"name": "LIGHT VEHICLES", "q": [{"id": "14.10", "text": "Does each LV carry: first aid kit, dry powder AND water extinguishers, warning triangles, cargo barrier / load restraint, sharps container, portable spill kit and UHF – with airbags, reverse alarm, horn and a seatbelt for every occupant?", "ref": "WHSMP 20.4; 31; ERP 7.10", "snn": ["VD"]}, {"id": "14.11", "text": "Has the pre-drive check been completed and recorded today?", "ref": "TMP 8.2", "snn": ["VD"]}, {"id": "14.12", "text": "Are tray loads restrained, and gas cylinders carried upright in a ventilated tray (never in the cabin), below DG placard thresholds?", "ref": "HSDG 16", "snn": ["VD"]}, {"id": "14.13", "text": "Are vehicles leaving site clean (no mud, soil or plant material) after using the wheel wash?", "ref": "CEMP 27", "snn": []}, {"id": "14.14", "text": "Spot check 2 drivers: do they hold an unrestricted licence for the vehicle class and a Genus LV VOC?", "ref": "TMP 7.5", "snn": ["VD", "FND"]}]}, {"name": "JOURNEY MANAGEMENT & COMMUTE", "q": [{"id": "14.15", "text": "Is a JMP (Get-Home-Safe app / FRM-SHEQ-GNP-0048) completed for high-risk journeys – 4 h or more sealed, 2 h or more unsealed, 2 h or more night driving, or travel advisories in place?", "ref": "WHSMP 30.1", "snn": ["VD"]}, {"id": "14.16", "text": "Are driving limits met – 10 min break every 2 h, 30 min after 4 h, no more than 10 h driving in 24 h?", "ref": "TMP 7.11", "snn": ["VD", "FFW"]}, {"id": "14.17", "text": "Is the workforce mini-bus driven by the rostered driver, with a seatbelt for each occupied seat and a passenger list kept?", "ref": "TMP 7.11; ERP App B", "snn": ["VD"]}, {"id": "14.18", "text": "Are unsealed landowner road limits followed (40 km/h; 20 km/h wet or dusty), gates left as found and livestock given right of way?", "ref": "TMP 7.11; 6.7", "snn": ["VD"]}, {"id": "14.19", "text": "Where weather affects the access route, is today's Adverse Weather and Site Access TARP travel decision recorded?", "ref": "TMP 6.1; ERP 10.2.6", "snn": ["VD"]}]}]}, {"num": 15, "title": "15 – Excavation & Ground Disturbance", "short": "Excavation & Ground Disturbance", "scope": "Excavations, trenches, potholing and all ground penetration – services, collapse, access, atmosphere, water, fauna and heritage.", "extra": ["Excavation Permit No:", "Max depth (m):"], "sections": [{"name": "BEFORE DIGGING", "q": [{"id": "15.1", "text": "Is an Excavation Permit (FRM-SHEQ-GNP-0043) in place for ANY ground penetration deeper than 300 mm?", "ref": "WHSMP 32", "snn": ["UU", "FND"]}, {"id": "15.2", "text": "Are current BYDA plans and service drawings on site and reviewed (Plan, Prepare)?", "ref": "WHSMP 32", "snn": ["UU"]}, {"id": "15.3", "text": "Have services been potholed by non-destructive digging (hand / vac) to confirm location and depth, then marked and briefed (Pothole, Protect) BEFORE machine digging?", "ref": "WHSMP 32", "snn": ["UU"]}, {"id": "15.4", "text": "Is the Excavation SWMS (SWMS-SHEQ-GNP-0005) and JHA in place, with a competent spotter present for the duration of the excavation?", "ref": "WHSMP 32", "snn": ["UU"]}, {"id": "15.5", "text": "Is a YAC Heritage Monitor present for ground disturbance (unless the Principal has advised otherwise), and does the crew know the chance-find stop-work rule?", "ref": "CEMP 13.3; 13.4", "snn": []}, {"id": "15.6", "text": "Is the work within the approved works / clearing area, with no disturbance of TPZs or ESAs?", "ref": "CEMP 13.1; 14", "snn": []}]}, {"name": "EXCAVATION CONDITION", "q": [{"id": "15.7", "text": "Is every excavation deeper than 1.5 m benched, battered or shored to the SWMS / design, with a spotter present whenever anyone is in it?", "ref": "WHSMP 32", "snn": []}, {"id": "15.8", "text": "Are spoil and plant kept back from the edge (at least 1 m, or further where the SWMS / engineer specifies), outside the zone of influence?", "ref": "WHSMP 32; Excavation CoP", "snn": []}, {"id": "15.9", "text": "Is safe access and egress provided within reach of workers (secured ladder extending 1 m above the edge, or a ramp)?", "ref": "WHSMP 32; Excavation CoP", "snn": []}, {"id": "15.10", "text": "Is the excavation physically barricaded (rigid barrier / mesh – not tape alone) with 'Danger – Open Excavation' signs, and water-filled barriers where it abuts a trafficked lane?", "ref": "WHSMP 32", "snn": []}, {"id": "15.11", "text": "Has the Supervisor inspected the excavation today – and after rain of 10 mm/h or 25 mm in 24 h – for cracking, slumping or water ingress?", "ref": "WHSMP 29 Table 24; ERP 10.2.3", "snn": []}, {"id": "15.12", "text": "Are plant exhausts directed away from the excavation, with gas monitoring where an altered atmosphere is possible (treated as a confined space if indicated)?", "ref": "WHSMP 32", "snn": ["CS"]}, {"id": "15.13", "text": "Is water inflow removed by vac truck / pump, with NO untested dewater discharged to land or drainage?", "ref": "WHSMP 32; CEMP 26.2", "snn": []}, {"id": "15.14", "text": "Do excavations left open overnight have fauna escape ramps, and are they checked for fauna at the start of shift?", "ref": "WHSMP 32; CEMP 13.8", "snn": []}, {"id": "15.15", "text": "Does the crew know to stop work for suspected ACM, contamination or acid sulfate soil indicators (odour, staining, fragments) – 10 m exclusion for ACM, then notify?", "ref": "CEMP 24.1", "snn": []}, {"id": "15.16", "text": "At end of shift, are excavations covered or barricaded and access roads to open works closed with hard barricades?", "ref": "SSMP", "snn": []}]}]}, {"num": 16, "title": "16 – Welding & Hot Work", "short": "Welding & Hot Work", "scope": "Welding, grinding, oxy-cutting, exothermic welding and any spark or flame-producing work.", "extra": ["Hot Work Permit No:", "Fire watch:"], "sections": [{"name": "PERMIT & FIRE CONDITIONS", "q": [{"id": "16.1", "text": "Is a Hot Work Permit (FRM-SHEQ-GNP-0042) in place that records today's FDR, TFB / HVMB status and wind, and is it displayed at the work front?", "ref": "BFMP 8.2", "snn": ["FND"]}, {"id": "16.2", "text": "Confirm hot work is NOT happening on a TFB day, a Catastrophic day, in the open air on an Extreme day, during an HVMB (unless the ban conditions allow), or at sustained wind of 50 km/h or more in dry conditions.", "ref": "BFMP 8.2; ERP 10.2.2", "snn": ["FND"]}, {"id": "16.3", "text": "Is a trained fire watch (CPPFES2005) present during the work AND staying 30 minutes after it ends?", "ref": "BFMP 8.2", "snn": ["FND"]}, {"id": "16.4", "text": "Are combustibles within 15 m removed, covered with non-combustible covers or wetted down?", "ref": "BFMP 8.2", "snn": []}, {"id": "16.5", "text": "Is at least one 4.5 kg DPE at the work (plus a water extinguisher where Class A combustibles are present) – and in the bushfire season (1 Oct–30 Apr) a 1,000 L or larger firefighting appliance at the work area?", "ref": "BFMP 8.2; 12.1", "snn": []}, {"id": "16.6", "text": "Are 'Hot Work in Progress – No Smoking – No Naked Flame – 5 m Exclusion' signs and screens in place to protect others?", "ref": "WHSMP 39.2", "snn": []}]}, {"name": "OXY-FUEL", "q": [{"id": "16.7", "text": "Are flashback arrestors (AS 4603) fitted at BOTH the regulator and torch ends on the oxygen and acetylene lines?", "ref": "WHSMP 28", "snn": []}, {"id": "16.8", "text": "Are cylinders upright and secured on a trolley or cage, with a CO₂ / dry chemical extinguisher on the trolley?", "ref": "WHSMP 28", "snn": []}, {"id": "16.9", "text": "In storage, are oxygen and fuel gas cylinders at least 5 m apart (or separated by a fire-resistant wall), signed 'No Smoking' and 'Authorised Personnel Only'?", "ref": "WHSMP 28", "snn": []}, {"id": "16.10", "text": "Has today's soapy-water leak test been done (never a flame) and the weekly hose inspection recorded, with hoses free of damage and oil?", "ref": "WHSMP 28", "snn": []}, {"id": "16.11", "text": "Are flint lighters used for ignition – no cigarette lighters or matches?", "ref": "WHSMP 28", "snn": []}]}, {"name": "ELECTRIC WELDING & GRINDING", "q": [{"id": "16.12", "text": "Is the welder test-tagged, the earth clamp attached close to the work, and leads / hoses routed clear of walkways and vehicles?", "ref": "WHSMP 28; 27.2", "snn": []}, {"id": "16.13", "text": "Are welding leads undamaged and not stored on top of the welding machine?", "ref": "WHSMP 28", "snn": []}, {"id": "16.14", "text": "Is double eye protection worn (helmet plus safety glasses), with screens protecting others from flash?", "ref": "WHSMP 28; 37", "snn": []}, {"id": "16.15", "text": "Is fume controlled – open air or LEV / forced ventilation, with a respirator where the SWMS requires?", "ref": "WHSMP 28", "snn": []}, {"id": "16.16", "text": "Are grinders 125 mm or smaller, guarded, both handles fitted, with spark direction controlled?", "ref": "WHSMP 31.4.1", "snn": ["FND"]}, {"id": "16.17", "text": "Is a rod-stub bucket used, and the area checked for smouldering material before the crew leaves?", "ref": "BFMP 8.2", "snn": []}]}]}, {"num": 17, "title": "17 – Bushfire Prevention & Fire Equipment", "short": "Bushfire Prevention & Fire Equipment", "scope": "Daily fire danger controls, firefighting appliances, extinguishers, APZs and firebreaks, ignition sources and preparedness.", "extra": ["Today's FDR:", "TFB / HVMB declared? (Y/N):"], "sections": [{"name": "DAILY FIRE DANGER CONTROLS", "q": [{"id": "17.1", "text": "Was today's FDR, TFB (DFES) and HVMB (Shire of Dandaragan) status checked before shift, briefed at pre-start and recorded on the pre-start form, JHA and site diary?", "ref": "BFMP 10.1", "snn": []}, {"id": "17.2", "text": "Was status re-checked at midday, and any new declaration broadcast on UHF 24 and recorded?", "ref": "BFMP 10.1", "snn": []}, {"id": "17.3", "text": "Is the FDR escalation matrix displayed at the pre-start area and on the Emergency Response Board?", "ref": "BFMP 10.2", "snn": []}, {"id": "17.4", "text": "On High or above days, is a lookout nominated – and on Extreme / Catastrophic days was the BFMP Appendix D checklist completed that morning?", "ref": "BFMP 10.2; App D", "snn": []}, {"id": "17.5", "text": "Are restricted activities actually stopped – no slashing or grading at Extreme+; off-road plant on formed tracks and pads only during a TFB or HVMB?", "ref": "BFMP 8.1; 10.3; 10.4", "snn": []}]}, {"name": "FIREFIGHTING RESOURCES", "q": [{"id": "17.6", "text": "Is a firefighting appliance (1,000 L or more, pump, hose, nozzle, amber beacon) with a trained operator at EVERY active work area?", "ref": "BFMP 12.1", "snn": []}, {"id": "17.7", "text": "Is the appliance at the right posture for today's FDR (full at start of shift; at least 50% at High; full and staged at Extreme), with its daily pre-start recorded?", "ref": "BFMP App B", "snn": []}, {"id": "17.8", "text": "Are extinguishers where required: 9 kg DPE per building; 4.5 kg at the diesel pod and on the refuelling vehicle; DPE + WE in each vehicle; suited extinguisher on each plant item; foam outside chemical storage; 4 spares for hot work?", "ref": "BFMP 12.5 Table 14", "snn": []}, {"id": "17.9", "text": "Is each extinguisher mounted, signed, unobstructed, gauge in the green, pin and seal intact, with quarterly inspection and 6-monthly service tags current and listed on the fire equipment register?", "ref": "BFMP 12.5", "snn": []}, {"id": "17.10", "text": "Is the firefighting water filling point (bore / turkey's nest) accessible?", "ref": "BFMP 12.4", "snn": []}]}, {"name": "FUEL MANAGEMENT & IGNITION SOURCES", "q": [{"id": "17.11", "text": "Are perimeter firebreaks (min. 3 m wide, 4 m vertical clearance) maintained around compounds and laydowns per the Shire notice?", "ref": "BFMP 8.1", "snn": []}, {"id": "17.12", "text": "Is a 5 m mineral earth break kept around fuel and chemical stores, with stores at least 10 m from vegetation?", "ref": "BFMP 8.3", "snn": []}, {"id": "17.13", "text": "Is grass in laydowns, parking, pre-start and amenity areas kept at or below 100 mm?", "ref": "BFMP 8.1", "snn": []}, {"id": "17.14", "text": "Are vehicles and plant parked only on hardstand / cleared ground – never parked or idling on dry grass?", "ref": "BFMP 8.4", "snn": []}, {"id": "17.15", "text": "Are petrol small plant (pumps, compactors, generators, brush-cutters) fitted with spark arrestors and refuelled only when cool at the bunded area?", "ref": "BFMP 8.4", "snn": []}, {"id": "17.16", "text": "Are internal tracks, gates and turnarounds clear for fire appliances, with gate keys / codes held by the Chief Warden?", "ref": "BFMP 8.1", "snn": []}, {"id": "17.17", "text": "Confirm NO burning of waste or vegetation is taking place.", "ref": "BFMP 8.6; 10.5", "snn": []}]}, {"name": "PREPAREDNESS", "q": [{"id": "17.18", "text": "Ask 2 workers: do they know how to raise a fire alarm on UHF 24 and that they must never engage the head of a fire?", "ref": "BFMP 13.1; 15", "snn": []}, {"id": "17.19", "text": "Has the pre-season readiness review (BFMP Appendix C) been completed for this season, and the bushfire drill scheduled or completed?", "ref": "BFMP 11; 15", "snn": []}]}]}, {"num": 18, "title": "18 – Hazardous Chemicals & Dangerous Goods Storage", "short": "Hazardous Chemicals & Dangerous Goods Storage", "scope": "Chemical approval, SDS, labelling, segregation, bunding, bulk diesel, gas cylinders, spill response and SF₆.", "extra": ["Store / location:"], "sections": [{"name": "APPROVAL & INFORMATION", "q": [{"id": "18.1", "text": "Spot check 3 products: is each approved in ChemAlert?", "ref": "HSDG 8; 10", "snn": []}, {"id": "18.2", "text": "Is a current Australian SDS (issued within 5 years) at the storage point AND at the SDS station at the site entrance?", "ref": "HSDG 9", "snn": []}, {"id": "18.3", "text": "Are all containers labelled (product name and hazard pictograms as a minimum) – including decanted containers not used immediately – and no food or drink containers used?", "ref": "HSDG 11", "snn": []}, {"id": "18.4", "text": "Are any unlabelled containers marked 'Caution – Do Not Use – Unknown Substance' and reported?", "ref": "HSDG 11", "snn": []}]}, {"name": "SEGREGATION & STORAGE", "q": [{"id": "18.5", "text": "Check against the segregation chart posted at the store (HSDG App B): are flammable gases (acetylene, LPG) at least 5 m from flammable liquids and diesel; oxygen at least 5 m from fuel gases (or behind a fire-resistant wall); and corrosives at least 3 m from flammables?", "ref": "HSDG 13.3 App B; WHSMP 28", "snn": []}, {"id": "18.6", "text": "Are petrol and solvents (Class 3) kept OUT of the diesel storage and its bund, in a flammable liquids cabinet?", "ref": "HSDG 7.1", "snn": []}, {"id": "18.7", "text": "Are aerosols in a dedicated aerosol cabinet (not with Class 3), and no aerosols or gas cylinders left in vehicles?", "ref": "HSDG 13.6; App A", "snn": []}, {"id": "18.8", "text": "Are gas cylinders upright and secured in a ventilated cage, valve guards fitted, full and empty cylinders separated and labelled?", "ref": "HSDG 13.4", "snn": []}, {"id": "18.9", "text": "Is LPG stored outdoors, away from drains, pits and openings where gas could collect?", "ref": "HSDG 13.4", "snn": []}, {"id": "18.10", "text": "Are liquids not stored above solids, and heavy containers kept low?", "ref": "HSDG 13.3; AS/NZS 3833", "snn": []}]}, {"name": "CONTAINMENT & BULK FUEL", "q": [{"id": "18.11", "text": "Is every bund at least 110% of the largest container, intact and free of rainwater / oil, with drip trays under dispensing points and drums in use?", "ref": "HSDG 13.2", "snn": []}, {"id": "18.12", "text": "Are diesel tanks self-bunded on level hardstand with impact protection, overfill protection and a lockable dispensing point?", "ref": "HSDG 13.5", "snn": []}, {"id": "18.13", "text": "Are C1 placards displayed at the diesel storage (and site entrance as required), with no-smoking / ignition source signs?", "ref": "HSDG 6.3; 13.5", "snn": []}, {"id": "18.14", "text": "Does the fuel compound have Class B extinguishers and a large hydrocarbon spill kit, and is all refuelling more than 50 m from any watercourse, farm dam or bore?", "ref": "HSDG 13.5", "snn": []}]}, {"name": "EMERGENCY, PPE & SPECIAL MATERIALS", "q": [{"id": "18.15", "text": "Is the RIGHT spill kit present – hydrocarbon at fuel, general chemical at stores, acid-neutralising at batteries – stocked, and inspected monthly on FRM-SHEQ-GNP-0093?", "ref": "HSDG 18", "snn": []}, {"id": "18.16", "text": "Is an eye wash reachable within 10 seconds where corrosives or batteries are handled, and a foam extinguisher outside the chemical store?", "ref": "HSDG 13.1; WHSMP 37", "snn": []}, {"id": "18.17", "text": "Is the SDS PPE available at the point of use and worn when decanting or handling?", "ref": "HSDG 14", "snn": ["FND"]}, {"id": "18.18", "text": "Are SF₆ cylinders upright, shaded, ventilated, away from pits and low points – with SF₆ handled only by OEM-authorised persons?", "ref": "HSDG 15", "snn": []}, {"id": "18.19", "text": "Confirm NO prohibited materials on site – asbestos-containing items, PFAS fire-fighting foams, or nuclear density gauges.", "ref": "HSDG 7.2", "snn": []}, {"id": "18.20", "text": "Is the weekly DG store inspection recorded (SHE Advisor), and the monthly / post-rain inspection (Environmental Lead)?", "ref": "HSDG 21", "snn": []}]}]}, {"num": 19, "title": "19 – Workshop & Maintenance Areas", "short": "Workshop & Maintenance Areas", "scope": "Workshop, maintenance bays and field servicing locations.", "extra": [], "sections": [{"name": "HOUSEKEEPING & LAYOUT", "q": [{"id": "19.1", "text": "Are benches and work areas tidy, waste bins provided and used, and walkways and emergency exits clear and marked?", "ref": "WHSMP 38.1", "snn": []}, {"id": "19.2", "text": "Is lighting adequate for the tasks being done?", "ref": "WHSMP 18.1", "snn": []}, {"id": "19.3", "text": "Is stock stored stable on racking – heavy items low, racking not overloaded or damaged?", "ref": "WHSMP 38.1", "snn": []}]}, {"name": "MACHINERY & TOOLS", "q": [{"id": "19.4", "text": "Are fixed machines (bench grinder, drill press, saws) guarded, with 'Danger – Rotating Machinery – Keep Clear' signs and tool rests / eye shields adjusted?", "ref": "WHSMP 31.4.1", "snn": ["FND"]}, {"id": "19.5", "text": "Are loose clothing, jewellery and unsecured long hair kept clear of rotating equipment (gloves only where the SWMS allows)?", "ref": "WHSMP 31.4.1", "snn": []}, {"id": "19.6", "text": "Are electrical tools test-tagged and RCD protected, with faulty items tagged Out of Service?", "ref": "WHSMP 27.2", "snn": ["EI"]}, {"id": "19.7", "text": "Are hand tools in good condition and right for the task – no mushroomed chisels, cracked handles or cheater bars?", "ref": "WHSMP 31.4", "snn": ["FND"]}, {"id": "19.8", "text": "Are compressed air hoses and fittings in good condition, with whip checks on couplings?", "ref": "WHSMP 26 (stored energy)", "snn": []}, {"id": "19.9", "text": "Is plant under repair isolated and locked out (PRO-SHEQ-GNP-0041), with guards reinstated and checked before it returns to service?", "ref": "WHSMP 26; 31.4.1", "snn": ["FND", "EI"]}]}, {"name": "FLUIDS, CHEMICALS & EMERGENCY", "q": [{"id": "19.10", "text": "Is servicing done on a spill mat / drip tray, with drip trays under stationary plant?", "ref": "HSDG 13.2; CEMP 22", "snn": []}, {"id": "19.11", "text": "Are waste oil, used filters and oily rags in sealed, labelled, bunded containers for licensed collection?", "ref": "WMP; HSDG 17", "snn": []}, {"id": "19.12", "text": "Are SDS for workshop chemicals available and their controls followed?", "ref": "HSDG 9", "snn": []}, {"id": "19.13", "text": "Is the workshop wall-mounted eye wash accessible, flushed and tagged monthly?", "ref": "ERP 7.9 Table 12", "snn": []}, {"id": "19.14", "text": "Are extinguishers identified, inspected and unobstructed?", "ref": "BFMP 12.5", "snn": []}, {"id": "19.15", "text": "Is ventilation adequate for fumes, dust and battery charging?", "ref": "WHSMP 20", "snn": []}]}]}, {"num": 20, "title": "20 – Environmental & Biosecurity", "short": "Environmental & Biosecurity", "scope": "Weekly environmental inspection: ESAs, heritage, biosecurity, fauna, water, spills, dust, waste, noise and land access.", "extra": [], "sections": [{"name": "CLEARING, ESAS & HERITAGE", "q": [{"id": "20.1", "text": "Are ESAs, exclusion areas and TPZs – including the 20 Carnaby's black cockatoo habitat trees – physically demarcated and signed, with NO plant, parking, storage or refuelling inside them?", "ref": "CEMP 13.1; 13.6", "snn": []}, {"id": "20.2", "text": "Is all work inside the approved works / clearing area (boundary demarcated and surveyed), with no off-track driving?", "ref": "CEMP 14; 14.1", "snn": []}, {"id": "20.3", "text": "Are heritage sites and finds demarcated (pink / black) as No Access, and is a YAC Heritage Monitor present during ground disturbance?", "ref": "CEMP 13.3", "snn": []}]}, {"name": "BIOSECURITY & DIEBACK", "q": [{"id": "20.4", "text": "Observe the gate: does EVERY vehicle use the wheel wash on exit, and is the sump de-silted before it reaches 50% capacity?", "ref": "CEMP 27", "snn": []}, {"id": "20.5", "text": "Do LVs entering ESAs or moving between farm parcels carry brush-down kits, and is FRM-SHEQ-GNP-0092 weed hygiene completed for all newly mobilised plant?", "ref": "CEMP 15", "snn": []}, {"id": "20.6", "text": "Is the dry-soil rule followed – in wet soil, only the main limestone access track is used and no dieback-mapped area is entered?", "ref": "CEMP 28", "snn": []}, {"id": "20.7", "text": "Is soil, mulch or fill moved only with the Environmental Lead's clearance recorded in the hygiene register?", "ref": "CEMP 15", "snn": []}]}, {"name": "FAUNA", "q": [{"id": "20.8", "text": "Do open excavations, trenches and the turkey's nest have fauna escape ramps, checked at the start of each shift?", "ref": "CEMP 13.8; 26.1", "snn": []}, {"id": "20.9", "text": "Are fauna sightings and strikes recorded in MYOSH – and no feeding of wildlife or pets on site?", "ref": "CEMP 13.5", "snn": []}]}, {"name": "WATER, SPILLS & DUST", "q": [{"id": "20.10", "text": "Is the turkey's nest fenced (1.8 m) with controlled access, and are the daily abstraction log and weekly bore meter readings recorded?", "ref": "CEMP 26.1", "snn": []}, {"id": "20.11", "text": "Are ESC controls (sediment fences, silt traps, swales, culverts) intact, and inspected within 24 h of rain of 10 mm or more?", "ref": "CEMP 18; 10", "snn": []}, {"id": "20.12", "text": "Are stockpiles out of drainage lines with down-gradient sediment controls – topsoil no higher than 2 m, mulch no higher than 1.8 m?", "ref": "CEMP 18; 30", "snn": []}, {"id": "20.13", "text": "Is concrete washout ONLY into the lined, bunded washout pit – none on natural ground?", "ref": "CEMP 26.2; WMP", "snn": []}, {"id": "20.14", "text": "Are spill kits stocked and inspected monthly, with no staining or unreported spills around plant, fuel points and generators?", "ref": "CEMP 22", "snn": []}, {"id": "20.15", "text": "Are dust controls working – water carts operating, and dust-generating work stopped if visible dust is drifting toward a residence, public road or Badgingarra National Park?", "ref": "CEMP 17", "snn": []}]}, {"name": "WASTE, NOISE, LIGHTING & LAND ACCESS", "q": [{"id": "20.16", "text": "Are waste streams segregated (general, scrap steel, locked copper / aluminium, timber, cardboard, plastics), bins lidded and less than ¾ full, with no wind-blown litter?", "ref": "WMP; CEMP 23", "snn": []}, {"id": "20.17", "text": "Are controlled wastes (waste oil, filters, oily rags) in the bunded, lockable controlled waste store, with tracking forms for every removal?", "ref": "WMP; CEMP 23", "snn": []}, {"id": "20.18", "text": "Are works within the authorised noise hours (06:00–18:00 per the NMP), and plant switched off when not in use (idling target 3 min or less)?", "ref": "CEMP 19; 31.1", "snn": []}, {"id": "20.19", "text": "Is site lighting directed and shielded to limit light spill beyond the work area?", "ref": "CEMP 16", "snn": []}, {"id": "20.20", "text": "Are landowner gates left as found and any damage to fences, gates, tracks or stock reported to the LAC?", "ref": "CEMP 25", "snn": []}]}]}, {"num": 21, "title": "21 – Traffic Management – Cowalla Road", "short": "Traffic Management – Cowalla Road", "scope": "Cowalla Road site entry and exit against the approved TGS (TGS-AC-001), the Traffic / Vehicle Movement Plan and AS 1742.3. Mandatory twice daily (AM pre-start and PM before leaving site) while the temporary speed zone is in force.", "fixed": [["Company", "Genus Infrastructure Pty Ltd (GNI)"], ["Project / Contract", "YMT – Parron Wind Farm Connection (J1084)"], ["Principal / Client", "Zephyr Energy (via Atmos Renewables)"], ["Job / Project Number", "J1084"], ["Area / Location of Inspection", "Cowalla Rd - Site Entry and Exit"], ["Approved TGS No. (Traffic Guidance Scheme)", "TGS-AC-001"]], "lockLocation": "Cowalla Rd - Site Entry and Exit", "hideStd": ["crew", "supervisor"], "extra": ["Weather / ground conditions:"], "checks": {"title": "Traffic Management Verification & Sign-Off – Cowalla Road (MRWA)", "intro": "Mandatory twice daily while the temporary speed zone is in force. The zone operates 24 hours / 7 days in unattended (after-care) mode outside working hours. Complete both checks, log the exact times and enter detailed records in the Traffic Management Diary (TMD).", "cols": ["AM – Pre-Start", "PM – Before Leaving Site"], "rows": ["Time completed (24 hr)", "Inspected by (full name)", "Weather (wind / rain / dust)"], "photos": ["Direction 1 – from the vehicle, down the middle of the road", "Direction 2 – opposite direction, down the middle of the road"], "photoShort": ["Direction 1", "Direction 2"]}, "note": "Authority: reinstate signage to its designated TGS position only. Any fault requiring relocation, addition, removal or alteration of signs or devices – do not modify. Escalate to the accredited person / traffic management contractor and record it in the Traffic Management Diary.", "imageTitle": "Approved TGS – TGS-AC-001 (visual reference)", "sections": [{"name": "A. Traffic Management – Cowalla Road", "q": [{"id": "21.1", "text": "Is all signage present at each designated point per the TGS / VMP (road and site)?", "ref": "TGS-AC-001; VMP; AS 1742.3", "snn": ["TMP"]}, {"id": "21.2", "text": "Is all signage undamaged, clean, secure and correctly oriented – no faded, bent or obscured signs?", "ref": "TGS-AC-001; VMP; AS 1742.3", "snn": ["TMP"]}, {"id": "21.3", "text": "Is advance warning signage in place on the approaches to the work zone?", "ref": "TGS-AC-001; VMP; AS 1742.3", "snn": ["TMP"]}, {"id": "21.4", "text": "Are the posted speed limits displayed and being observed by all traffic?", "ref": "TGS-AC-001; VMP; AS 1742.3", "snn": ["VD", "TMP"]}, {"id": "21.5", "text": "Is the road surface condition safe – no significant potholes, corrugations or edge drop-off?", "ref": "TGS-AC-001; VMP; AS 1742.3", "snn": ["VD"]}, {"id": "21.6", "text": "Is dust suppression adequate to maintain visibility for all road users?", "ref": "TGS-AC-001; VMP; AS 1742.3", "snn": ["VD"]}, {"id": "21.7", "text": "Is the public / local traffic interface being managed?", "ref": "TGS-AC-001; VMP; AS 1742.3", "snn": ["TMP"]}, {"id": "21.8", "text": "Is the full sign inventory present and correctly spaced: Advance Warning · 100→80 · 80→60 · Construction Entry · Reinstatement / End Roadworks?", "ref": "TGS-AC-001; VMP; AS 1742.3", "snn": ["TMP"]}, {"id": "21.9", "text": "Are signs upright, square to oncoming traffic and within motorist sightlines, with ballast / sandbags secure and adequate for the prevailing wind?", "ref": "TGS-AC-001; VMP; AS 1742.3", "snn": ["TMP"]}, {"id": "21.10", "text": "Is the retroreflective sheeting clean and free of dust build-up, with signs legible under headlights at night?", "ref": "TGS-AC-001; VMP; AS 1742.3", "snn": ["TMP"]}, {"id": "21.11", "text": "Is the Cowalla Road sealed surface at the entry free of site-won sand or gravel tracked out by vehicles?", "ref": "TGS-AC-001; VMP; AS 1742.3", "snn": ["VD"]}]}], "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCANaBLIDASIAAhEBAxEB/8QAHQABAQACAwEBAQAAAAAAAAAAAAYFBwIDBAgBCf/EAGgQAAEDAwICAgkOCgYGBggCCwECAwQABREGEgchEzEUFhciQVFW0tMIFSMyN1RVYZOUlbPR1DZCV3F1gZGSlrQkMzVSc3Q0YqGxssIYU3J2pLUlJkNGgoOEwURjZaKj8GQnRYWGxPH/xAAbAQEAAgMBAQAAAAAAAAAAAAAAAQYDBAUCB//EAEQRAQABAgMFAwkFBgQGAwEAAAABAhEDBCEFEjFBUWGR4QYTIjJxgaGx8BRCUmLRBxUzcsHxFoKy4jVTkqLS4xcjQ1T/2gAMAwEAAhEDEQA/APqmp/Qf4Msf48n69ynbxavemoPoGd6GoPRXHHQjGnGEKuVwWemkK3NWea4kgvLIwpLJB5Hx0G3KVAd3fQXwhdfoOf6Gnd30F8IXX6Dn+hoL+lQHd30F8IXX6Dn+hp3d9BfCF1+g5/oaC/pUB3d9BfCF1+g5/oad3fQXwhdfoOf6Ggv6VAd3fQXwhdfoOf6Gsff+NukJ9kmxLbeLpFmS
